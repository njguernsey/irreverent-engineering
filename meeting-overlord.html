<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Overlord | Irreverent Engineering</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #191a1f;
            --ink: #fff;
            --ink-soft: rgba(255, 255, 255, 0.6);
            --acid-lime: #c5fb29;
            --deep-clay: #b39ddb;
            --bezel: #0b0b0d;
            --aluminium: #c4c7cc;
            --aluminium-dark: #9a9ea5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        p, li, blockquote { text-wrap: pretty; }
        h1, h2 { text-wrap: balance; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 24px;
            color: var(--acid-lime);
            text-decoration: none;
            font-weight: 700;
        }

        html.framed .back-link { display: none; }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 64px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 64px 7% 72px;
        }

        /* LAPTOP */
        .laptop { width: 100%; }

        .lid {
            background: var(--bezel);
            border-radius: 18px 18px 0 0;
            padding: 2.4% 2.4% 3.2%;
            box-shadow: 0 0 0 1.5px #2a2b30;
            position: relative;
        }

        /* Camera */
        .lid::before {
            content: "";
            position: absolute;
            top: 1.1%;
            left: 50%;
            width: 6px;
            height: 6px;
            margin-left: -3px;
            border-radius: 50%;
            background: #26272c;
        }

        .screen {
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #fff;
            position: relative;
        }

        /* The browser window is laid out at 1280×800 and scaled to fit the screen */
        .window {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 800px;
            transform-origin: 0 0;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .toolbar {
            height: 52px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 18px;
            background: #e9eaee;
            border-bottom: 1px solid #d3d5da;
            font-size: 15px;
            color: #3c4043;
        }

        .lights { display: flex; gap: 9px; }
        .lights span { width: 13px; height: 13px; border-radius: 50%; }
        .lights span:nth-child(1) { background: #ff5f57; }
        .lights span:nth-child(2) { background: #febc2e; }
        .lights span:nth-child(3) { background: #28c840; }

        .address {
            flex: 1;
            max-width: 720px;
            margin: 0 auto;
            height: 34px;
            border-radius: 999px;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            color: #5f6368;
        }

        .ext {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #f3e8fd;
        }

        .ext .badge {
            position: absolute;
            top: -3px;
            right: -5px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 999px;
            background: #d50000;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            line-height: 18px;
            text-align: center;
        }

        .calendar-frame { flex: 1; width: 100%; border: 0; display: block; }

        .base {
            position: relative;
            height: 0;
            padding-bottom: 3.2%;
            margin: 0 -7%;
            background: var(--aluminium);
            border-radius: 0 0 14px 14px / 0 0 60% 60%;
            box-shadow: inset 0 2px 0 #e3e5e8, inset 0 -3px 0 var(--aluminium-dark);
        }

        /* Thumb notch for opening the lid */
        .base::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 16%;
            height: 38%;
            transform: translateX(-50%);
            background: var(--aluminium-dark);
            border-radius: 0 0 10px 10px;
        }

        /* PITCH */
        .pitch {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
            gap: 28px 64px;
            align-items: start;
        }

        .pitch-head { display: flex; flex-direction: column; gap: 20px; }
        .pitch-body { display: flex; flex-direction: column; gap: 28px; }

        .kicker { color: var(--deep-clay); font-weight: 500; font-size: 0.95rem; margin-bottom: 8px; }

        .pitch h2 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        .rating { display: flex; align-items: center; gap: 10px; }
        .stars { display: flex; gap: 3px; color: var(--acid-lime); }
        .rating-text { font-weight: 700; }

        blockquote {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        blockquote footer {
            margin-top: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0;
            color: var(--deep-clay);
        }

        .download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            align-self: flex-start;
            padding: 16px 22px;
            background: var(--acid-lime);
            color: #000;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 5px 5px 0 var(--deep-clay);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .download:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--deep-clay); }
        .download:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--deep-clay); }

        @media (prefers-reduced-motion: reduce) {
            .download { transition: none; }
        }

        @media (max-width: 760px) {
            .stage { gap: 40px; padding: 64px 24px 40px; }
            .laptop { padding: 0 6%; }
            .pitch { grid-template-columns: 1fr; }
            .pitch h2 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back</a>

    <main class="stage">
        <div class="laptop">
            <div class="lid">
                <div class="screen" id="screen">
                    <div class="window" id="window">
                        <div class="toolbar">
                            <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
                            <div class="address">
                                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z"/></svg>
                                calendar/week
                            </div>
                            <div class="ext" title="Meeting Overlord">
                                <svg width="20" height="20" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 32 L10 14 L16 23 L20 10 L24 23 L30 14 L33 32 Z" fill="#f6bf26" stroke="#8e24aa" stroke-width="2.5" stroke-linejoin="round"/></svg>
                                <span class="badge" id="badge">25</span>
                            </div>
                        </div>
                        <iframe class="calendar-frame" id="calendar" src="meeting-overlord-calendar.html" data-device="laptop" title="Meeting Overlord calendar"></iframe>
                    </div>
                </div>
            </div>
            <div class="base" aria-hidden="true"></div>
        </div>

        <section class="pitch">
            <div class="pitch-head">
                <div>
                    <p class="kicker">Browser add-on</p>
                    <h2>Meeting Overlord</h2>
                </div>

                <div class="rating" aria-label="Rated 5 out of 5 stars">
                    <div class="stars" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/></svg>
                        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/></svg>
                        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/></svg>
                        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/></svg>
                        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/></svg>
                    </div>
                    <span class="rating-text">5/5</span>
                </div>
            </div>

            <div class="pitch-body">
                <blockquote>
                    &ldquo;How did this get on to my computer? This is a nightmare, get this thing out of here.&rdquo;
                    <footer>&mdash; Doug, first adopter</footer>
                </blockquote>

                <a href="#" class="download" id="download">
                    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                    Download the browser add-on
                </a>
            </div>
        </section>
    </main>

    <script>
        if (window.self !== window.top) document.documentElement.classList.add('framed');

        // Scale the 1280-wide browser window to the laptop screen
        const screenEl = document.getElementById('screen');
        const win = document.getElementById('window');
        function fit() {
            const s = screenEl.clientWidth / 1280;
            win.style.transform = `scale(${s})`;
        }
        fit();
        window.addEventListener('resize', fit);
        if ('ResizeObserver' in window) new ResizeObserver(fit).observe(screenEl);

        // The download link is for show
        document.getElementById('download').addEventListener('click', e => e.preventDefault());

        const frame = document.getElementById('calendar');
        frame.addEventListener('load', () => {
            const cal = frame.contentWindow;
            if (!cal || !cal.document) return;

            // Esc inside the calendar reaches this page, so the homepage modal can close.
            // The calendar stops Esc itself while one of its event cards is open.
            cal.document.addEventListener('keydown', e => {
                if (e.key === 'Escape') document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
            });

            // Keep the add-on badge in step with the Overlord's meeting count
            const badge = document.getElementById('badge');
            const count = () => {
                badge.textContent = cal.document.querySelectorAll('.event:not(.mine)').length;
            };
            count();
            new cal.MutationObserver(count).observe(cal.document.getElementById('grid'), { childList: true, subtree: true });
        });
    </script>
</body>
</html>
