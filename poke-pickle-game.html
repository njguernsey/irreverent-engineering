<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKé Pickle | Irreverent Engineering</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥒</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Inter:wght@500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: radial-gradient(ellipse at 50% 40%, #1f2a1c, #0c100b 75%);
            color: #e9f2d8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 5;
            color: rgba(233, 242, 216, 0.7);
            text-decoration: none;
            font-weight: 500;
        }

        html.framed .back-link { display: none; }

        .stage {
            height: 100%;
            display: grid;
            place-items: center;
            align-content: center;
            gap: 14px;
            padding: 20px;
        }

        /* The screen: a soft bezel around crisp pixels */
        .bezel {
            padding: 14px;
            border-radius: 18px;
            background: linear-gradient(145deg, #2a3326, #151a13);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -2px 0 rgba(0, 0, 0, 0.4);
        }

        .screen { position: relative; border-radius: 6px; overflow: hidden; }

        @media (max-width: 559px) {
            .stage { padding: 12px; }
            .bezel { padding: 8px; border-radius: 14px; }
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: pointer;
            outline: none;
        }

        /* Faint scanlines */
        .screen::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.06) 0 1px, transparent 1px 3px);
        }

        .hint { font-size: 12px; color: rgba(233, 242, 216, 0.5); }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back</a>

    <div class="stage" id="stage">
        <div class="bezel">
            <div class="screen">
                <canvas id="game" width="480" height="320" tabindex="0" aria-label="POKé Pickle battle. Use arrow keys and Enter, or click."></canvas>
            </div>
        </div>
        <p class="hint">Arrow keys and Enter, or click</p>
    </div>

    <script>
        if (window.self !== window.top) document.documentElement.classList.add('framed');

        const W = 480, H = 320;
        const canvas = document.getElementById('game');
        const g = canvas.getContext('2d');
        const FONT = '"Pixelify Sans", sans-serif';
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------- SCALE THE SCREEN TO FIT ---------- */
        function fit() {
            const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
            const narrow = vw < 560;
            const availW = vw - (narrow ? 44 : 80), availH = vh - 110;
            const s = Math.min(availW / W, availH / H);
            // Whole or half steps keep the pixels even; a phone just gets whatever fits
            const step = s >= 2 ? Math.floor(s * 2) / 2 : s >= 1 ? Math.floor(s * 4) / 4 : s;
            canvas.style.width = W * step + 'px';
            canvas.style.height = H * step + 'px';
        }
        fit();
        addEventListener('resize', fit);

        /* ---------- SOUND: little square-wave blips ---------- */
        let audio = null;
        function blip(freqs, dur = 0.06, type = 'square', vol = 0.035) {
            try {
                audio = audio || new (window.AudioContext || window.webkitAudioContext)();
                if (audio.state === 'suspended') audio.resume();
                let t = audio.currentTime;
                freqs.forEach(f => {
                    const o = audio.createOscillator(), v = audio.createGain();
                    o.type = type;
                    o.frequency.setValueAtTime(f, t);
                    v.gain.setValueAtTime(vol, t);
                    v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                    o.connect(v).connect(audio.destination);
                    o.start(t);
                    o.stop(t + dur + 0.02);
                    t += dur * 0.9;
                });
            } catch (e) { /* no audio, no problem */ }
        }
        const sfx = {
            move: () => blip([880], 0.03),
            select: () => blip([660, 990], 0.05),
            hit: () => blip([180, 120, 90], 0.06, 'sawtooth', 0.05),
            throwJar: () => blip([400, 600, 800, 1000], 0.04),
            wobble: () => blip([300, 260], 0.07),
            catch: () => blip([523, 659, 784, 1047], 0.1, 'square', 0.04),
            nope: () => blip([200, 150], 0.09),
        };

        /* ---------- PICKLE SPRITES, drawn small and scaled up crisp ---------- */
        const COL = {
            outline: '#1e3a14', body: '#6aa83a', dark: '#4c8a28', light: '#9ccf5e', bump: '#3f7520',
            eye: '#141a12', white: '#ffffff', cheek: '#e8504a', yellow: '#d6d84a', flame: '#ff9a2a', flameHi: '#ffe066',
            lid: '#d9b24a', lidDark: '#a8842a', pink: '#e9a0b8',
        };

        function sprite(size, draw) {
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const x = c.getContext('2d');
            draw(x);
            return c;
        }

        function ellipse(x, cx, cy, rx, ry, rot, fill, stroke) {
            x.beginPath();
            x.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2);
            if (fill) { x.fillStyle = fill; x.fill(); }
            if (stroke) { x.strokeStyle = stroke; x.lineWidth = 1; x.stroke(); }
        }

        // The house style: an oblong pickle with bumps and a shine
        function pickle(x, cx, cy, rx, ry, rot, tint = COL.body) {
            ellipse(x, cx, cy, rx, ry, rot, tint, COL.outline);
            ellipse(x, cx + 2, cy + 3, rx - 3, ry - 4, rot, COL.dark);
            ellipse(x, cx, cy, rx - 2, ry - 2, rot, tint);
            ellipse(x, cx - rx * 0.35, cy - ry * 0.35, rx * 0.22, ry * 0.45, rot, COL.light);
            const bumps = [[-0.3, 0.2], [0.25, -0.3], [0.35, 0.35], [-0.1, 0.55], [0.05, -0.6], [-0.45, -0.1]];
            x.fillStyle = COL.bump;
            bumps.forEach(([bx, by]) => x.fillRect(Math.round(cx + bx * rx), Math.round(cy + by * ry), 2, 2));
        }

        function eyes(x, lx, ly, rx, ry, big = false) {
            const s = big ? 4 : 3;
            [[lx, ly], [rx, ry]].forEach(([ex, ey]) => {
                x.fillStyle = COL.eye; x.fillRect(ex, ey, s, s + 1);
                x.fillStyle = COL.white; x.fillRect(ex + 1, ey, 1, 1);
            });
        }

        const SPRITES = {
            dillbasaur: sprite(56, x => {
                // From behind: a sturdy pickle with a dill frond sprouting from its back
                pickle(x, 28, 34, 16, 20, 0.15);
                x.strokeStyle = '#2f7a2a'; x.lineWidth = 1;
                for (let i = 0; i < 7; i++) {
                    x.beginPath(); x.moveTo(30, 16); x.lineTo(30 + Math.cos(-2.6 + i * 0.4) * 14, 16 + Math.sin(-2.6 + i * 0.4) * 12); x.stroke();
                }
                ellipse(x, 30, 16, 3, 2, 0, '#2f7a2a');
            }),
            picklechu: sprite(48, x => {
                // Ears with dark tips
                x.fillStyle = COL.outline;
                x.beginPath(); x.moveTo(14, 16); x.lineTo(8, 1); x.lineTo(20, 13); x.fill();
                x.beginPath(); x.moveTo(30, 13); x.lineTo(40, 1); x.lineTo(35, 17); x.fill();
                x.fillStyle = COL.yellow;
                x.beginPath(); x.moveTo(15, 15); x.lineTo(10, 5); x.lineTo(19, 13); x.fill();
                x.beginPath(); x.moveTo(31, 13); x.lineTo(38, 5); x.lineTo(34, 16); x.fill();
                // Zigzag tail
                x.fillStyle = COL.yellow; x.strokeStyle = COL.outline;
                x.beginPath(); x.moveTo(36, 30); x.lineTo(46, 24); x.lineTo(42, 32); x.lineTo(47, 34); x.lineTo(38, 38); x.closePath(); x.fill(); x.stroke();
                pickle(x, 24, 28, 13, 16, 0.1, COL.yellow);
                eyes(x, 17, 22, 27, 21);
                x.fillStyle = COL.cheek; x.fillRect(13, 28, 4, 3); x.fillRect(31, 27, 4, 3);
                x.fillStyle = COL.eye; x.fillRect(22, 29, 4, 1); x.fillRect(21, 28, 1, 1); x.fillRect(26, 28, 1, 1);
            }),
            gherkinzard: sprite(48, x => {
                // Tail with a flame on the end
                x.strokeStyle = COL.outline; x.lineWidth = 3;
                x.beginPath(); x.moveTo(30, 36); x.quadraticCurveTo(44, 36, 42, 22); x.stroke();
                x.strokeStyle = COL.body; x.lineWidth = 1.5; x.stroke();
                ellipse(x, 42, 17, 4, 6, 0, COL.flame);
                ellipse(x, 42, 19, 2, 3, 0, COL.flameHi);
                pickle(x, 22, 26, 11, 18, -0.15);
                // Little wings
                x.fillStyle = COL.dark; x.strokeStyle = COL.outline; x.lineWidth = 1;
                x.beginPath(); x.moveTo(12, 20); x.lineTo(3, 12); x.lineTo(8, 26); x.closePath(); x.fill(); x.stroke();
                eyes(x, 17, 16, 24, 15);
                x.fillStyle = COL.eye; x.fillRect(19, 23, 5, 1);
            }),
            brinetle: sprite(48, x => {
                // A jar lid worn as a shell
                pickle(x, 24, 30, 15, 12, 0);
                ellipse(x, 28, 24, 13, 9, 0, COL.lid, COL.lidDark);
                x.fillStyle = COL.lidDark;
                for (let i = 0; i < 6; i++) x.fillRect(18 + i * 4, 21, 1, 7);
                ellipse(x, 11, 27, 6, 6, 0, COL.body, COL.outline);
                eyes(x, 8, 25, 12, 25);
                x.fillStyle = COL.eye; x.fillRect(9, 30, 3, 1);
            }),
            jigglypickle: sprite(48, x => {
                pickle(x, 24, 27, 16, 16, 0, '#7dbb4a');
                // A curl on top
                x.strokeStyle = COL.outline; x.lineWidth = 1.5;
                x.beginPath(); x.arc(22, 10, 4, Math.PI * 0.2, Math.PI * 1.9); x.stroke();
                eyes(x, 16, 21, 27, 21, true);
                x.fillStyle = COL.pink; x.fillRect(13, 29, 4, 2); x.fillRect(31, 29, 4, 2);
                x.fillStyle = COL.eye; x.fillRect(22, 31, 4, 1);
            }),
            cornichonite: sprite(48, x => {
                // Small, stony, arms up
                x.strokeStyle = COL.outline; x.lineWidth = 2;
                x.beginPath(); x.moveTo(15, 28); x.lineTo(7, 18); x.moveTo(33, 28); x.lineTo(41, 18); x.stroke();
                pickle(x, 24, 31, 11, 10, 0, '#8aa070');
                x.fillStyle = '#6d7f58';
                [[18, 26], [29, 34], [22, 37], [31, 27]].forEach(([a, b]) => x.fillRect(a, b, 3, 2));
                eyes(x, 19, 28, 26, 28);
            }),
        };

        // Pickle jars: the plain one, the great one, the mason one
        function jarSprite(lid, glass) {
            return sprite(20, x => {
                x.fillStyle = 'rgba(190, 230, 160, 0.55)'; x.strokeStyle = COL.outline; x.lineWidth = 1;
                x.beginPath(); x.roundRect(4, 6, 12, 13, 3); x.fill(); x.stroke();
                x.fillStyle = glass; x.fillRect(6, 10, 8, 7);
                x.fillStyle = lid; x.fillRect(3, 3, 14, 4);
                x.strokeRect(3.5, 3.5, 13, 3);
                x.fillStyle = 'rgba(255,255,255,0.7)'; x.fillRect(6, 8, 1, 6);
            });
        }
        const JARS = {
            jar: jarSprite('#d9b24a', '#6aa83a'),
            great: jarSprite('#4a7ad9', '#6aa83a'),
            mason: jarSprite('#9a6ad9', '#6aa83a'),
        };

        /* ---------- GAME STATE ---------- */
        const WILD = [
            { kind: 'picklechu', name: 'Picklechu', moves: ['Brine Shock', 'Quick Crunch'] },
            { kind: 'gherkinzard', name: 'Gherkinzard', moves: ['Dill Flame', 'Sour Slash'] },
            { kind: 'brinetle', name: 'Brinetle', moves: ['Brine Gun', 'Lid Bash'] },
            { kind: 'jigglypickle', name: 'Jigglypickle', moves: ['Sing (badly)', 'Pickle Pound'] },
            { kind: 'cornichonite', name: 'Cornichonite', moves: ['Rock Crunch', 'Tiny Tantrum'] },
        ];

        const player = { kind: 'dillbasaur', name: 'Dillbasaur', lvl: 12, hp: 44, max: 44, shownHp: 44 };
        const MOVES = [
            { name: 'Brine Splash', min: 7, max: 11, line: "It's super pickly!" },
            { name: 'Crunch', min: 9, max: 13, line: "A satisfying crunch!" },
            { name: 'Dill Beam', min: 4, max: 16, line: "Dill everywhere." },
            { name: 'Vinegar Glare', min: 0, max: 0, line: "It's not very effective. It never is." },
        ];
        const bag = [
            { id: 'jar', name: 'Pickle Jar', count: 5, rate: 1 },
            { id: 'great', name: 'Great Jar', count: 3, rate: 1.6 },
            { id: 'mason', name: 'Mason Jar', count: 1, rate: 99 },
            { id: 'brine', name: 'Brine', count: 3 },
            { id: 'gherkin', name: 'Rare Gherkin', count: 1 },
        ];
        const party = ['Dillbasaur'];

        let enemy = null;
        let mode = 'text';                  // text | main | fight | bag | busy
        let cursor = 0;
        let queue = [], line = null, shown = 0, onDone = null;
        let fx = { enemyX: 0, enemyFlash: 0, enemyScale: 1, enemyHide: false, playerX: 0, playerFlash: 0, jar: null, shake: 0, stars: 0 };
        let regions = [];

        const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

        function newEnemy() {
            const w = WILD[rand(0, WILD.length - 1)];
            const lvl = rand(5, 14);
            enemy = { ...w, lvl, max: 18 + lvl * 2, hp: 18 + lvl * 2, shownHp: 18 + lvl * 2 };
            fx.enemyHide = false; fx.enemyScale = 1; fx.enemyFlash = 0; fx.jar = null;
        }

        /* ---------- TEXT ---------- */
        function say(lines, after) {
            queue = Array.isArray(lines) ? [...lines] : [lines];
            onDone = after || (() => toMenu());
            mode = 'text';
            nextLine();
        }

        function nextLine() {
            line = queue.shift();
            shown = 0;
            if (line == null) { const done = onDone; onDone = null; line = null; done && done(); }
        }

        let typeTimer = setInterval(() => {
            if (mode === 'text' && line && shown < line.length) { shown += 1; draw(); }
        }, 24);

        function advance() {
            if (mode !== 'text' || !line) return;
            if (shown < line.length) { shown = line.length; draw(); return; }
            sfx.move();
            nextLine();
            draw();
        }

        function toMenu() { mode = 'main'; cursor = 0; draw(); }

        /* ---------- TWEENS (timer driven, so they work anywhere) ---------- */
        function tween(ms, step, done) {
            if (reduceMotion) { step(1); draw(); done && done(); return; }
            const start = performance.now();
            const tick = () => {
                const t = Math.min(1, (performance.now() - start) / ms);
                step(t);
                draw();
                if (t < 1) setTimeout(tick, 16); else done && done();
            };
            tick();
        }
        const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
        const play = (ms, step) => new Promise(r => tween(ms, step, r));

        async function drainHp(who, to) {
            const from = who.shownHp;
            who.hp = Math.max(0, to);
            await play(450, t => { who.shownHp = from + (who.hp - from) * t; });
        }

        async function hitFlash(side) {
            sfx.hit();
            for (let i = 0; i < 3; i++) {
                fx[side + 'Flash'] = 1; draw(); await wait(70);
                fx[side + 'Flash'] = 0; draw(); await wait(70);
            }
        }

        async function lunge(side) {
            const dir = side === 'player' ? 1 : -1;
            await play(120, t => { fx[side + 'X'] = dir * 14 * t; });
            await play(160, t => { fx[side + 'X'] = dir * 14 * (1 - t); });
        }

        function sayAsync(lines) { return new Promise(r => say(lines, r)); }

        /* ---------- TURNS ---------- */
        async function useMove(m) {
            mode = 'busy';
            await sayAsync(`${player.name} used ${m.name}!`);
            mode = 'busy';
            await lunge('player');
            if (m.max > 0) {
                await hitFlash('enemy');
                await drainHp(enemy, enemy.hp - rand(m.min, m.max));
            }
            await sayAsync(m.line);
            if (enemy.hp <= 0) {
                fx.enemyHide = true; draw();
                await sayAsync([`The wild ${enemy.name} fainted!`, `It has been pickled to perfection.`]);
                return encounter('Another');
            }
            await enemyTurn();
        }

        async function enemyTurn() {
            mode = 'busy';
            const m = enemy.moves[rand(0, enemy.moves.length - 1)];
            await sayAsync(`The wild ${enemy.name} used ${m}!`);
            mode = 'busy';
            await lunge('enemy');
            await hitFlash('player');
            await drainHp(player, player.hp - rand(3, 8));
            if (player.hp <= 0) {
                await sayAsync([`${player.name} fainted!`, 'You rushed to the nearest deli.', `${player.name} is crunchy again.`]);
                player.hp = player.shownHp = player.max;
                draw();
            }
            toMenu();
        }

        async function throwJar(item) {
            mode = 'busy';
            item.count--;
            await sayAsync(`You threw a ${item.name}!`);
            mode = 'busy';
            // Arc from the player's side to the wild pickle
            sfx.throwJar();
            await play(520, t => {
                fx.jar = { kind: item.id, x: 120 + 230 * t, y: 190 - 120 * t - Math.sin(t * Math.PI) * 120, rot: t * 12 };
            });
            // The pickle is sucked into the jar
            await play(260, t => { fx.enemyFlash = 1; fx.enemyScale = 1 - t; });
            fx.enemyHide = true; fx.enemyFlash = 0;
            await play(220, t => { fx.jar.y = 70 + 36 * t; fx.jar.rot = 0; });
            const hpPart = enemy.hp / enemy.max;
            const chance = Math.min(1, (1 - hpPart * 0.7) * 0.55 * item.rate);
            let wobbles = 0;
            for (let i = 0; i < 3; i++) {
                if (Math.random() > chance + 0.15) break;
                wobbles++;
                await wait(250);
                sfx.wobble();
                await play(360, t => { fx.jar.rot = Math.sin(t * Math.PI * 2) * 0.35; });
            }
            await wait(300);
            if (wobbles === 3 || item.rate > 50) {
                sfx.catch();
                await play(500, t => { fx.stars = t; });
                party.push(enemy.name);
                await sayAsync([`Gotcha! ${enemy.name} was jarred!`, `${enemy.name} has joined your pickles.`]);
                fx.stars = 0; fx.jar = null;
                return encounter('Another');
            }
            sfx.nope();
            fx.jar = null; fx.enemyHide = false;
            await play(260, t => { fx.enemyScale = t; });
            await sayAsync([wobbles ? 'Argh! It was so close to being pickled!' : 'Oh no! The pickle broke free!']);
            await enemyTurn();
        }

        async function useItem(item) {
            if (item.count <= 0) { sfx.nope(); return say(`You're out of ${item.name}s.`, () => openBag()); }
            if (item.rate) return throwJar(item);
            mode = 'busy';
            item.count--;
            if (item.id === 'brine') {
                await sayAsync(`You poured Brine on ${player.name}.`);
                mode = 'busy';
                await drainHp(player, Math.min(player.max, player.hp + 20));
                await sayAsync(`${player.name} feels briny and refreshed.`);
            } else {
                player.lvl++;
                player.max += 3;
                await sayAsync([`${player.name} ate the Rare Gherkin.`, `${player.name} grew to level ${player.lvl}!`, 'It is still a pickle.']);
            }
            await enemyTurn();
        }

        async function encounter(word = 'A') {
            newEnemy();
            fx.enemyX = 200;
            mode = 'busy';
            await play(500, t => { fx.enemyX = 200 * (1 - t); });
            say(`${word} wild ${enemy.name} appeared!`, () => say(`What will ${player.name} do?`, toMenu));
        }

        function openBag() { mode = 'bag'; cursor = 0; draw(); }

        /* ---------- MENUS ---------- */
        const MAIN = ['Fight', 'Bag', 'Pickles', 'Flee'];

        function choose(i) {
            sfx.select();
            if (mode === 'main') {
                if (i === 0) { mode = 'fight'; cursor = 0; return draw(); }
                if (i === 1) return openBag();
                if (i === 2) return say([`Your pickles: ${party.join(', ')}.`, 'They are all pickles.']);
                if (i === 3) {
                    return Math.random() < 0.5
                        ? say("You can't escape a pickle. It rolls.", () => enemyTurn())
                        : say('Got away safely! The pickle is still out there.', () => encounter());
                }
            }
            if (mode === 'fight') return i === MOVES.length ? toMenu() : useMove(MOVES[i]);
            if (mode === 'bag') return i === bag.length ? toMenu() : useItem(bag[i]);
        }

        function back() {
            if (mode === 'fight' || mode === 'bag') { sfx.move(); toMenu(); }
        }

        function optionCount() {
            return mode === 'main' ? 4 : mode === 'fight' ? MOVES.length + 1 : mode === 'bag' ? bag.length + 1 : 0;
        }

        addEventListener('keydown', e => {
            const k = e.key;
            if (mode === 'text') {
                if (['Enter', ' ', 'z', 'Z', 'x', 'X'].includes(k)) { e.preventDefault(); advance(); }
                return;
            }
            const n = optionCount();
            if (!n) return;
            const cols = mode === 'bag' ? 1 : 2;
            let next = cursor;
            if (k === 'ArrowRight' || k === 'd') next = cols === 2 && cursor % 2 === 0 ? cursor + 1 : cursor;
            else if (k === 'ArrowLeft' || k === 'a') next = cols === 2 && cursor % 2 === 1 ? cursor - 1 : cursor;
            else if (k === 'ArrowDown' || k === 's') next = cursor + cols;
            else if (k === 'ArrowUp' || k === 'w') next = cursor - cols;
            else if (['Enter', ' ', 'z', 'Z'].includes(k)) { e.preventDefault(); return choose(cursor); }
            else if (['x', 'X', 'Backspace'].includes(k)) { e.preventDefault(); return back(); }
            else return;
            e.preventDefault();
            if (next >= 0 && next < n && next !== cursor) { cursor = next; sfx.move(); draw(); }
        });

        function pointFromEvent(e) {
            const r = canvas.getBoundingClientRect();
            return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
        }

        canvas.addEventListener('click', e => {
            canvas.focus();
            if (mode === 'text') return advance();
            const p = pointFromEvent(e);
            const hit = regions.find(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
            if (hit) { cursor = hit.i; choose(hit.i); }
        });

        canvas.addEventListener('mousemove', e => {
            if (mode === 'text' || mode === 'busy') return;
            const p = pointFromEvent(e);
            const hit = regions.find(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
            if (hit && hit.i !== cursor) { cursor = hit.i; sfx.move(); draw(); }
        });

        /* ---------- DRAWING ---------- */
        function box(x, y, w, h, fill = '#f8fbef') {
            g.fillStyle = '#26402a';
            g.beginPath(); g.roundRect(x, y, w, h, 10); g.fill();
            g.fillStyle = '#b7d48a';
            g.beginPath(); g.roundRect(x + 3, y + 3, w - 6, h - 6, 8); g.fill();
            g.fillStyle = fill;
            g.beginPath(); g.roundRect(x + 6, y + 6, w - 12, h - 12, 6); g.fill();
        }

        function text(str, x, y, size = 18, color = '#22301f', weight = 400) {
            g.font = `${weight} ${size}px ${FONT}`;
            g.fillStyle = color;
            g.textBaseline = 'alphabetic';
            g.fillText(str, x, y);
        }

        function hpBox(who, x, y, w, showNumbers) {
            box(x, y, w, showNumbers ? 70 : 56);
            text(who.name, x + 16, y + 26, 18, '#22301f', 600);
            text(`Lv${who.lvl}`, x + w - 58, y + 26, 16);
            const bx = x + 50, by = y + 36, bw = w - 70;
            text('HP', x + 16, by + 9, 13, '#e0a020', 600);
            g.fillStyle = '#3c4a38'; g.fillRect(bx - 2, by - 2, bw + 4, 12);
            g.fillStyle = '#e8eedc'; g.fillRect(bx, by, bw, 8);
            const pct = Math.max(0, who.shownHp / who.max);
            g.fillStyle = pct > 0.5 ? '#4fc860' : pct > 0.2 ? '#f0c030' : '#e04848';
            g.fillRect(bx, by, Math.round(bw * pct), 8);
            if (showNumbers) text(`${Math.ceil(Math.max(0, who.shownHp))} / ${who.max}`, x + w - 92, y + 62, 15);
        }

        function drawSprite(img, x, y, scale, flash, hide, s = 1) {
            if (hide) return;
            const w = img.width * scale * s, h = img.height * scale * s;
            g.save();
            g.imageSmoothingEnabled = false;
            if (flash) g.filter = 'brightness(3) saturate(0)';
            g.drawImage(img, x + (img.width * scale - w) / 2, y + (img.height * scale - h), w, h);
            g.restore();
        }

        function draw() {
            regions = [];
            // Field
            g.fillStyle = '#eef5df'; g.fillRect(0, 0, W, H);
            g.fillStyle = '#dcebc4'; g.fillRect(0, 120, W, 110);
            for (let y = 124; y < 228; y += 6) { g.fillStyle = 'rgba(120,160,80,0.08)'; g.fillRect(0, y, W, 2); }

            // Platforms
            g.fillStyle = '#a9c97a';
            g.beginPath(); g.ellipse(352, 116, 86, 18, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#c1dc95';
            g.beginPath(); g.ellipse(352, 112, 80, 14, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#a9c97a';
            g.beginPath(); g.ellipse(128, 222, 108, 20, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#c1dc95';
            g.beginPath(); g.ellipse(128, 218, 102, 16, 0, 0, Math.PI * 2); g.fill();

            // Wild pickle
            if (enemy) drawSprite(SPRITES[enemy.kind], 304 + fx.enemyX, 20, 2, fx.enemyFlash, fx.enemyHide, fx.enemyScale);
            // Your pickle, from behind
            drawSprite(SPRITES.dillbasaur, 60 + fx.playerX, 104, 2, fx.playerFlash, false);

            // A jar in flight, or sitting on the platform
            if (fx.jar) {
                g.save();
                g.translate(fx.jar.x, fx.jar.y);
                g.rotate(fx.jar.rot);
                g.imageSmoothingEnabled = false;
                g.drawImage(JARS[fx.jar.kind], -20, -20, 40, 40);
                g.restore();
                if (fx.stars) {
                    g.fillStyle = '#ffd84a';
                    for (let i = 0; i < 5; i++) {
                        const a = -Math.PI / 2 + (i - 2) * 0.5, d = 18 + fx.stars * 26;
                        g.fillRect(fx.jar.x + Math.cos(a) * d - 3, fx.jar.y - 10 + Math.sin(a) * d - 3, 6, 6);
                    }
                }
            }

            if (enemy) hpBox(enemy, 24, 20, 220, false);
            hpBox(player, 252, 140, 210, true);

            // Dialog
            box(6, 232, W - 12, 82);
            if (mode === 'text' && line) {
                const words = line.slice(0, shown);
                wrap(words, 26, 266, mode === 'text' ? 420 : 240);
                if (shown >= line.length && Math.floor(performance.now() / 400) % 2) {
                    g.fillStyle = '#e04848';
                    g.beginPath(); g.moveTo(446, 290); g.lineTo(458, 290); g.lineTo(452, 298); g.fill();
                }
            } else if (mode === 'main') {
                wrap(`What will ${player.name} do?`, 26, 266, 210);
                box(250, 232, 224, 82, '#ffffff');
                MAIN.forEach((label, i) => option(label, 286 + (i % 2) * 96, 266 + Math.floor(i / 2) * 30, i, 90));
            } else if (mode === 'fight') {
                MOVES.forEach((m, i) => option(m.name, 40 + (i % 2) * 190, 266 + Math.floor(i / 2) * 30, i, 180));
                option('Back', 410, 266, MOVES.length, 56);
            } else if (mode === 'bag') {
                wrap('Every item in the bag is a pickle.', 26, 266, 210);
                box(250, 40, 224, 190, '#ffffff');
                bag.forEach((it, i) => option(`${it.name}  x${it.count}`, 280, 74 + i * 28, i, 186));
                option('Close', 280, 74 + bag.length * 28, bag.length, 186);
            }
        }

        function option(label, x, y, i, w) {
            regions.push({ x: x - 22, y: y - 20, w: w + 22, h: 28, i });
            text(label, x, y, 18, '#22301f', cursor === i ? 600 : 400);
            if (cursor === i) {
                g.fillStyle = '#22301f';
                g.beginPath(); g.moveTo(x - 16, y - 13); g.lineTo(x - 8, y - 7); g.lineTo(x - 16, y - 1); g.fill();
            }
        }

        function wrap(str, x, y, maxW) {
            g.font = `400 18px ${FONT}`;
            const words = str.split(' ');
            let row = '', yy = y;
            words.forEach(word => {
                const test = row ? row + ' ' + word : word;
                if (g.measureText(test).width > maxW && row) { text(row, x, yy); row = word; yy += 26; }
                else row = test;
            });
            if (row) text(row, x, yy);
        }

        // Keep the ▼ blinking while a line waits
        setInterval(() => { if (mode === 'text' && line && shown >= line.length) draw(); }, 400);

        (document.fonts ? document.fonts.load(`18px ${FONT}`) : Promise.resolve()).then(() => {
            encounter();
        });
    </script>
</body>
</html>
