<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broccoli Facts | Irreverent Engineering</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #191a1f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #c5fb29;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }

        .background-broccoli {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: -1;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><text x="50%" y="50%" font-size="50" text-anchor="middle" dominant-baseline="middle">🥦</text></svg>');
            background-repeat: repeat;
            opacity: 0.2;
            animation: moveBroccoli 10s linear infinite;
            pointer-events: none;
        }

        @keyframes moveBroccoli {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, -100px); }
        }

        .iphone {
            width: 360px;
            height: 760px;
            background: #fff;
            border-radius: 60px;
            border: 12px solid transparent;
            background-image: linear-gradient(#fff, #fff), linear-gradient(to bottom right, #808000, #8fbc8f);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .dynamic-island {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 25px;
            background: linear-gradient(to bottom right, #808000, #8fbc8f);
            border-radius: 20px;
            z-index: 10;
        }

        .chat-header {
            background: #f8f8f8;
            padding: 60px 20px 15px;
            text-align: center;
            color: #333;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 80%;
            font-size: 1rem;
            line-height: 1.4;
        }

        .bot { background: #dbe6db; color: #000; align-self: flex-start; }

        /* Typing indicator */
        .typing { display: flex; gap: 5px; align-items: center; padding: 16px 18px; }
        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #5f7a5f;
            animation: typing-dot 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typing-dot {
            0%, 60%, 100% { opacity: 0.3; transform: none; }
            30% { opacity: 1; transform: translateY(-3px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .typing span { animation: none; opacity: 0.6; }
        }
        .user { background: #007aff; color: #fff; align-self: flex-end; }

        .input-area {
            padding: 20px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            background: #f8f8f8;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 1rem;
            resize: none;
            height: 40px;
            max-height: 120px;
            line-height: 1.4;
            font-family: inherit;
            box-sizing: border-box;
            overflow-y: hidden;
        }

        button {
            background: #8fbc8f;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        button:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back</a>

    <div class="background-broccoli"></div>

    <div class="iphone">
        <div class="dynamic-island"></div>
        <div class="chat-header">Broccoli Bot</div>
        <div class="chat-messages" id="chat">
            <div class="message bot">Hello! I am the Broccoli Facts Bot. Ask me anything about broccoli!</div>
        </div>
        <div class="input-area">
            <textarea id="userInput" placeholder="Type a message..." rows="1" oninput="this.style.height = '40px'; this.style.height = Math.min(this.scrollHeight, 120) + 'px';"></textarea>
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script type="module">
        import { createMatcher } from './broccoli-match.js';

        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const FALLBACK = "I'm sorry, I don't have an answer for that about broccoli right now.";

        // The conversation so far, sent with each question so the bot can follow along
        const history = [{ role: 'assistant', content: chat.querySelector('.message.bot').innerText }];

        // Offline answers come from the facts list, used whenever the AI can't be reached
        let matcher = null;
        fetch('broccoli-facts.json').then(r => r.json()).then(facts => { matcher = createMatcher(facts); }).catch(() => {});

        function addMessage(text, who) {
            const msg = document.createElement('div');
            msg.className = 'message ' + who;
            msg.innerText = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            return msg;
        }

        async function askBot() {
            const res = await fetch('/api/broccoli', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ messages: history })
            });
            if (!res.ok) throw new Error('Bot unavailable');
            const { reply } = await res.json();
            if (!reply) throw new Error('Empty reply');
            return reply;
        }

        let busy = false;
        async function sendMessage() {
            const text = input.value.trim();
            if (!text || busy) return;
            busy = true;
            sendBtn.disabled = true;

            addMessage(text, 'user');
            history.push({ role: 'user', content: text });
            input.value = '';
            input.style.height = '40px';

            const typing = addMessage('', 'bot typing');
            typing.setAttribute('aria-label', 'Broccoli Bot is typing');
            typing.innerHTML = '<span></span><span></span><span></span>';

            let reply;
            try {
                reply = await askBot();
            } catch {
                reply = (matcher && matcher.answer(text)) || FALLBACK;
            }

            typing.remove();
            addMessage(reply, 'bot');
            history.push({ role: 'assistant', content: reply });
            busy = false;
            sendBtn.disabled = false;
            input.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
