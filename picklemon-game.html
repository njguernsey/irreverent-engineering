<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picklémon | Irreverent Engineering</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥒</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Inter:wght@500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: radial-gradient(ellipse at 50% 40%, #1f2a1c, #0c100b 75%);
            color: #e9f2d8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 5;
            color: rgba(233, 242, 216, 0.7);
            text-decoration: none;
            font-weight: 500;
        }

        html.framed .back-link { display: none; }

        .stage {
            height: 100%;
            display: grid;
            place-items: center;
            align-content: center;
            gap: 14px;
            padding: 20px;
        }

        /* The screen: a soft bezel around crisp pixels */
        .bezel {
            padding: 14px;
            border-radius: 18px;
            background: linear-gradient(145deg, #2a3326, #151a13);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -2px 0 rgba(0, 0, 0, 0.4);
        }

        .screen { position: relative; border-radius: 6px; overflow: hidden; }

        @media (max-width: 559px) {
            .stage { padding: 12px; }
            .bezel { padding: 8px; border-radius: 14px; }
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: pointer;
            outline: none;
        }

        /* Faint scanlines */
        .screen::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.06) 0 1px, transparent 1px 3px);
        }

        .below {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 14px;
        }

        .hint { font-size: 12px; color: rgba(233, 242, 216, 0.5); text-wrap: balance; text-align: center; }

        .sound {
            font: 500 12px 'Inter', sans-serif;
            color: rgba(233, 242, 216, 0.75);
            background: rgba(233, 242, 216, 0.06);
            border: 1px solid rgba(233, 242, 216, 0.18);
            border-radius: 999px;
            padding: 4px 11px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        /* ?sheet: every pickle, front and back */
        .sheet {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
            width: min(1100px, 100%);
            max-height: calc(100vh - 40px);
            overflow: auto;
            padding: 8px;
        }

        .sheet figure { margin: 0; background: #eef5df; border-radius: 12px; padding: 10px; text-align: center; }
        .sheet canvas { width: 112px; height: 112px; image-rendering: pixelated; }
        .sheet figcaption { font-size: 13px; font-weight: 500; color: #22301f; margin-top: 4px; }

        .sound:hover { background: rgba(233, 242, 216, 0.12); color: #e9f2d8; }
        .sound[aria-pressed="false"] { color: rgba(233, 242, 216, 0.45); }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back</a>

    <div class="stage" id="stage">
        <div class="bezel">
            <div class="screen">
                <canvas id="game" width="480" height="320" tabindex="0" aria-label="Picklémon. Walk with the arrow keys, press Enter to talk, X for the menu, or click."></canvas>
            </div>
        </div>
        <div class="below">
            <p class="hint">Arrow keys to walk, Enter to talk, X for the menu. Or click.</p>
            <button class="sound" id="sound" type="button" aria-pressed="true">&#9834; Music on</button>
        </div>
    </div>

    <script>
        if (window.self !== window.top) document.documentElement.classList.add('framed');

        const W = 480, H = 320, TS = 32;
        const canvas = document.getElementById('game');
        const g = canvas.getContext('2d');
        const FONT = '"Pixelify Sans", sans-serif';
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------- SCALE THE SCREEN TO FIT ---------- */
        function fit() {
            const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
            const narrow = vw < 560;
            const availW = vw - (narrow ? 44 : 80), availH = vh - 110;
            const s = Math.min(availW / W, availH / H);
            // Whole or half steps keep the pixels even; a phone just gets whatever fits
            const step = s >= 2 ? Math.floor(s * 2) / 2 : s >= 1 ? Math.floor(s * 4) / 4 : s;
            canvas.style.width = W * step + 'px';
            canvas.style.height = H * step + 'px';
        }
        fit();
        addEventListener('resize', fit);

        /* ---------- SOUND: little square-wave blips ---------- */
        let audio = null, musicBus = null;
        function ensureAudio() {
            if (!audio) {
                audio = new (window.AudioContext || window.webkitAudioContext)();
                // Music goes through its own soft, slightly muffled bus so the blips sit on top
                const tone = audio.createBiquadFilter();
                tone.type = 'lowpass';
                tone.frequency.value = 3200;
                musicBus = audio.createGain();
                musicBus.gain.value = musicOn ? 1 : 0;
                musicBus.connect(tone).connect(audio.destination);
            }
            if (audio.state === 'suspended' && !document.hidden) audio.resume();
            return audio;
        }
        function blip(freqs, dur = 0.06, type = 'square', vol = 0.035) {
            try {
                ensureAudio();
                let t = audio.currentTime;
                freqs.forEach(f => {
                    const o = audio.createOscillator(), v = audio.createGain();
                    o.type = type;
                    o.frequency.setValueAtTime(f, t);
                    v.gain.setValueAtTime(vol, t);
                    v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                    o.connect(v).connect(audio.destination);
                    o.start(t);
                    o.stop(t + dur + 0.02);
                    t += dur * 0.9;
                });
            } catch (e) { /* no audio, no problem */ }
        }
        const sfx = {
            move: () => blip([880], 0.03),
            select: () => blip([660, 990], 0.05),
            hit: () => blip([180, 120, 90], 0.06, 'sawtooth', 0.05),
            throwJar: () => blip([400, 600, 800, 1000], 0.04),
            wobble: () => blip([300, 260], 0.07),
            catch: () => blip([523, 659, 784, 1047], 0.1, 'square', 0.04),
            nope: () => blip([200, 150], 0.09),
            bump: () => blip([110, 90], 0.05, 'square', 0.03),
            encounter: () => blip([660, 880, 660, 880, 990, 1320], 0.05),
            heal: () => blip([523, 659, 784, 659, 784, 1047], 0.11, 'square', 0.035),
            item: () => blip([784, 988, 1175, 1568], 0.08, 'square', 0.035),
            swap: () => blip([520, 390], 0.06),
        };

        /* ---------- MUSIC: two little chiptune loops, written for this game ---------- */
        // Lead notes are name:length in sixteenths, bars split by |. Roots are one per bar (two with a comma).
        // Drums are 16 steps per bar: k kick, s snare, h hat.
        const SONGS = {
            map: {
                bpm: 132, leadVol: 0.02, bassVol: 0.075,
                lead: 'G4:2 B4:2 D5:4 B4:2 D5:2 E5:4 | D5:4 B4:2 G4:2 A4:4 -:4 | C5:2 E5:2 G5:4 E5:2 C5:2 D5:4 | B4:6 A4:2 G4:8 | '
                    + 'E5:2 D5:2 C5:2 B4:2 C5:4 E5:4 | D5:2 C5:2 B4:2 A4:2 B4:4 D5:4 | C5:2 B4:2 A4:2 G4:2 A4:4 F#4:4 | G4:8 -:8',
                roots: 'G2 E2 C2 D2 C2 G2 A2,D2 G2',
                bass: [[0, 4], [7, 4], [12, 4], [7, 4]],
                drums: '....h.......h...',
            },
            battle: {
                bpm: 168, leadVol: 0.018, bassVol: 0.085,
                lead: 'A4:2 C5:2 E5:2 A5:4 G5:2 E5:2 C5:2 | D5:2 E5:2 C5:2 A4:6 -:4 | F5:2 E5:2 D5:2 C5:2 D5:4 A4:4 | G4:2 B4:2 D5:2 G5:6 F5:2 D5:2 | '
                    + 'E5:2 A5:2 E5:2 C5:2 E5:2 A4:2 C5:2 E5:2 | D5:3 C5:3 B4:2 C5:4 A4:4 | F5:2 A5:2 F5:2 C5:2 D5:2 F5:2 A5:4 | G#5:4 E5:4 B4:4 G#4:4',
                roots: 'A2 A2 F2 G2 A2 A2 F2 E2',
                bass: [[0, 2], [12, 2]],
                drums: 'k.h.s.h.k.h.s.hh',
            },
        };

        const midi = n => {
            const m = /^([A-G])([#b]?)(\d)$/.exec(n);
            return { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
        };
        const hz = note => 440 * Math.pow(2, (note - 69) / 12);

        function compile(song) {
            const events = [];
            let at = 0;
            song.lead.split('|').forEach(bar => bar.trim().split(/\s+/).forEach(tok => {
                const [n, len] = tok.split(':');
                if (n !== '-') events.push({ step: at, kind: 'lead', freq: hz(midi(n)), len: +len });
                at += +len;
            }));
            const total = at;
            song.roots.split(' ').forEach((bar, b) => {
                const parts = bar.split(','), seg = 16 / parts.length;
                parts.forEach((root, p) => {
                    for (let t = 0, i = 0; t < seg; i++) {
                        const [off, len] = song.bass[i % song.bass.length];
                        events.push({ step: b * 16 + p * seg + t, kind: 'bass', freq: hz(midi(root) + off), len: Math.min(len, seg - t) });
                        t += len;
                    }
                });
            });
            for (let b = 0; b < total / 16; b++) {
                [...song.drums].forEach((ch, i) => { if (ch !== '.') events.push({ step: b * 16 + i, kind: ch }); });
            }
            const byStep = Array.from({ length: total }, () => []);
            events.forEach(e => byStep[e.step].push(e));
            return { song, byStep, total, stepDur: 60 / song.bpm / 4 };
        }
        const TRACKS = { map: compile(SONGS.map), battle: compile(SONGS.battle) };

        let musicOn = true;
        try { musicOn = localStorage.getItem('picklemon-music') !== 'off'; } catch (e) { /* private window */ }
        let songName = 'map', track = null, songStep = 0, songAt = 0, noiseBuf = null;

        function setSong(name) {
            if (songName === name) return;
            songName = name;
            track = null;
        }

        function voice(type, f, t, dur, vol) {
            const o = audio.createOscillator(), v = audio.createGain();
            o.type = type;
            o.frequency.value = f;
            v.gain.setValueAtTime(0.0001, t);
            v.gain.exponentialRampToValueAtTime(vol, t + 0.008);
            v.gain.setValueAtTime(vol, t + Math.max(0.01, dur - 0.04));
            v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(v).connect(musicBus);
            o.start(t);
            o.stop(t + dur + 0.02);
        }

        function hiss(t, dur, vol, cutoff) {
            if (!noiseBuf) {
                noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            const src = audio.createBufferSource(), f = audio.createBiquadFilter(), v = audio.createGain();
            src.buffer = noiseBuf;
            f.type = 'highpass';
            f.frequency.value = cutoff;
            v.gain.setValueAtTime(vol, t);
            v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(f).connect(v).connect(musicBus);
            src.start(t, Math.random() * 0.5);
            src.stop(t + dur + 0.02);
        }

        function thump(t) {
            const o = audio.createOscillator(), v = audio.createGain();
            o.frequency.setValueAtTime(150, t);
            o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
            v.gain.setValueAtTime(0.12, t);
            v.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            o.connect(v).connect(musicBus);
            o.start(t);
            o.stop(t + 0.16);
        }

        // Schedule a little ahead on the audio clock, so the beat holds steady
        setInterval(() => {
            if (!audio || !musicOn || !songName || audio.state !== 'running') return;
            if (!track) { track = TRACKS[songName]; songStep = 0; songAt = audio.currentTime + 0.08; }
            if (songAt < audio.currentTime - 0.1) songAt = audio.currentTime + 0.05;
            const { song, byStep, total, stepDur } = track;
            while (songAt < audio.currentTime + 0.15) {
                byStep[songStep].forEach(e => {
                    if (e.kind === 'lead') voice('square', e.freq, songAt, e.len * stepDur * 0.92, song.leadVol);
                    else if (e.kind === 'bass') voice('triangle', e.freq, songAt, e.len * stepDur * 0.85, song.bassVol);
                    else if (e.kind === 'h') hiss(songAt, 0.03, 0.014, 7000);
                    else if (e.kind === 's') hiss(songAt, 0.1, 0.035, 1800);
                    else if (e.kind === 'k') thump(songAt);
                });
                songAt += stepDur;
                songStep = (songStep + 1) % total;
            }
        }, 25);

        const soundBtn = document.getElementById('sound');
        function showMusic() {
            soundBtn.setAttribute('aria-pressed', String(musicOn));
            soundBtn.innerHTML = `&#9834; Music ${musicOn ? 'on' : 'off'}`;
        }
        function toggleMusic() {
            musicOn = !musicOn;
            try { localStorage.setItem('picklemon-music', musicOn ? 'on' : 'off'); } catch (e) { /* fine */ }
            ensureAudio();
            musicBus.gain.setTargetAtTime(musicOn ? 1 : 0, audio.currentTime, 0.03);
            track = null;
            showMusic();
        }
        showMusic();
        soundBtn.addEventListener('click', () => { toggleMusic(); canvas.focus(); });

        // Browsers only allow sound after a click or key press
        addEventListener('pointerdown', ensureAudio, { capture: true });
        addEventListener('keydown', ensureAudio, { capture: true });
        document.addEventListener('visibilitychange', () => {
            if (!audio) return;
            if (document.hidden) audio.suspend(); else audio.resume();
        });

        /* ---------- DRAWING HELPERS FOR SPRITES ---------- */
        const COL = {
            outline: '#1e3a14', body: '#6aa83a', dark: '#4c8a28', light: '#9ccf5e', bump: '#3f7520',
            eye: '#141a12', white: '#ffffff', cheek: '#e8504a', yellow: '#d6d84a', flame: '#ff9a2a', flameHi: '#ffe066',
            lid: '#d9b24a', lidDark: '#a8842a', pink: '#e9a0b8',
        };

        function sprite(w, draw, h = w) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            draw(c.getContext('2d'));
            return c;
        }

        function mirror(img) {
            return sprite(img.width, x => { x.translate(img.width, 0); x.scale(-1, 1); x.drawImage(img, 0, 0); }, img.height);
        }

        // Pixel art written as rows of letters, one letter per pixel
        function stamp(x, rows, pal, ox = 0, oy = 0) {
            rows.forEach((row, y) => [...row].forEach((ch, i) => {
                if (!pal[ch]) return;
                x.fillStyle = pal[ch];
                x.fillRect(ox + i, oy + y, 1, 1);
            }));
        }
        const pix = (rows, pal) => sprite(rows[0].length, x => stamp(x, rows, pal), rows.length);

        /* ---------- PICKLE ART: a tiny pixel-art renderer ---------- */
        // Each pickle is a stack of shapes on a 56px grid: ellipses (E), polygons (P) and tapered
        // strokes (L), drawn back to front. Every pixel is then lit from the top left through a
        // five-step ramp, dithered a little, outlined, lined where parts overlap, given warts,
        // and finished with stamped faces (D).
        const MAT = {
            pickle: { ramp: ['#1c3616', '#2d5a20', '#47852d', '#6dab3f', '#a2d165'], out: '#0f220c', spec: '#e4f7b8' },
            dark: { ramp: ['#10260f', '#1c3f19', '#2b5c25', '#3f7a33', '#5f9a48'], out: '#0a1a09' },
            dill: { ramp: ['#173a14', '#245c1f', '#36802b', '#56a43c', '#86c85c'], out: '#0d230b' },
            bulb: { ramp: ['#2b4620', '#466f33', '#6b9a4f', '#9cc87a', '#d0eeb0'], out: '#1a2d14', spec: '#f0fbe2' },
            yellow: { ramp: ['#4d4a14', '#7f7a20', '#b2ac32', '#d8d455', '#f4f2a0'], out: '#2e2c0a', spec: '#fffde0' },
            ink: { ramp: ['#0e0f12', '#1b1d22', '#2a2d35', '#3d424d', '#5a6070'], out: '#060708', spec: '#8a90a0' },
            pink: { ramp: ['#5e2340', '#93395f', '#c95f86', '#eb90b1', '#fccbdc'], out: '#3a1427', spec: '#fff0f6' },
            pinkDeep: { ramp: ['#4a1530', '#7a2448', '#a8395f', '#c95f86', '#e88fae'], out: '#2e0c1d' },
            stone: { ramp: ['#2c3226', '#46503c', '#667456', '#8c9b78', '#b6c4a0'], out: '#1a1e16' },
            deep: { ramp: ['#0f1f19', '#1b3529', '#2a4f3b', '#3f6e52', '#5f9472'], out: '#08120e', spec: '#a8d0b0' },
            cream: { ramp: ['#5f4f33', '#8f7b55', '#c2ae82', '#e2d4ac', '#fbf3da'], out: '#3a301e' },
            purple: { ramp: ['#22113a', '#3c2163', '#5c368f', '#8257bb', '#ae88e0'], out: '#140a24', spec: '#e6d8ff' },
            orange: { ramp: ['#561f0e', '#8c3a18', '#c45e28', '#e88a44', '#ffbf80'], out: '#33120a', spec: '#fff0d8' },
            fin: { ramp: ['#5f4f22', '#97803c', '#c8ae5c', '#e6d388', '#fbf0c2'], out: '#3a3014' },
            white: { ramp: ['#5e6370', '#9399a6', '#c4c9d3', '#e6e9ef', '#ffffff'], out: '#2e323a' },
            blue: { ramp: ['#1a2a52', '#2c4685', '#3f66b5', '#6390dc', '#9bbcf2'], out: '#0e1730', spec: '#e0ecff' },
            glass: { ramp: ['#30504a', '#4f786c', '#7fa898', '#b5d6c6', '#e9f8f0'], out: '#1c302b', spec: '#ffffff' },
            pickleSoft: { ramp: ['#3a5a2c', '#527a3c', '#6d9a4e', '#8fb868', '#b6d68e'], out: '#2a4220' },
            lid: { ramp: ['#4f380e', '#80591c', '#b0832e', '#d9ac4c', '#f5d98a'], out: '#2e2006', spec: '#fff6d6' },
            flame: { ramp: ['#9a2e0e', '#d64a18', '#f27c1c', '#ffb03a', '#fff08a'], out: '#5a1606' },
            flameIn: { ramp: ['#d27a1a', '#f2a02a', '#ffd04a', '#ffe98a', '#fffbe0'], out: '#b85a12' },
            red: { ramp: ['#5a1212', '#8e1f1f', '#c43430', '#e8604e', '#ffa08c'], out: '#330808', spec: '#ffe0d8' },
            dirt: { ramp: ['#2e2016', '#4a3524', '#6b4f35', '#8f6e4c', '#b8946c'], out: '#1a120c' },
            wing: { ramp: ['#1f3d2a', '#2f5c3c', '#457f52', '#64a06c', '#8ec290'], out: '#11241a' },
            gherkin: { ramp: ['#16300f', '#24481a', '#386a26', '#548f36', '#7fb552'], out: '#0b1a07', spec: '#cfeaa0' },
            lime: { ramp: ['#36460f', '#58741a', '#83a02a', '#b0c93e', '#e2ef88'], out: '#1f2808', spec: '#f8ffd8' },
            chili: { ramp: ['#4a0c0c', '#7e1616', '#b82420', '#e04a36', '#ff8a70'], out: '#2a0606', spec: '#ffd8cc' },
            stem: { ramp: ['#3a3418', '#5a5226', '#7a7038', '#9a904e', '#bab06a'], out: '#221e0c' },
            // The inside of a pickle, for anything sliced open
            flesh: { ramp: ['#6d7a3a', '#9aab58', '#c4d384', '#dfe9a8', '#f4f9d4'], out: '#3e4620' },
            seed: { ramp: ['#8a7a4a', '#b8a670', '#dccb94', '#efe4b8', '#fffaf0'], out: '#5a4e2a' },
        };

        // Faces and markings, stamped on last
        const INK = { k: '#141a12', w: '#ffffff', r: '#e0484a', R: '#9a1e22', p: '#e86a92', y: '#ffe066', t: '#2f9a94', b: '#7a5a3a', g: '#8cc25a', B: '#a08b62', s: '#5f6b4c', o: '#ff9a3a' };
        const STAMP = {
            eye: ['.kk.', 'kwkk', 'kkkk', 'kkkk', '.kk.'],
            eyeSmall: ['kw', 'kk', 'kk'],
            eyeTall: ['kw', 'kk', 'kk', 'kk'],
            eyeBig: ['.kkkk.', 'kwwkkk', 'kwwttk', 'kkttkk', 'kktttk', '.kkkk.'],
            eyeShut: ['k....k', '.kkkk.'],
            eyeAngry: ['kk...', '.kkk.', '.kwkk', '.kkkk', '..kk.'],
            eyeRed: ['k.....', 'kkk...', 'krrkk.', 'krkrrk', '.kkkkk'],
            eyeFish: ['.kkkkk.', 'kwwwwwk', 'kwkwkwk', 'kwkkkwk', 'kwkkkwk', 'kwwwwwk', '.kkkkk.'],
            dot: ['kk', 'kk'],
            smile: ['k...k', '.kkk.'],
            open: ['kkkkk', 'krrrk', '.kkk.'],
            tiny: ['k.k', '.k.'],
            grin: ['k............k', 'kkwwwwwwwwwwkk', '.kkwwkwwkwwkk.', '...kkkkkkkk...'],
            fang: ['kkkkk', '..wk.'],
            grimace: ['kkkkkk', 'kwkwkk', 'kkkkkk'],
            snore: ['kkkkkk', '.w..w.'],
            wobbly: ['k....k', '.kkkk.'],
            pucker: ['kk', 'kk'],
            nose: ['k'],
            cheek: ['.rr.', 'rrrr', '.rr.'],
            blush: ['pp.pp'],
            claws: ['w.w.w'],
            stripe: ['bbbbbbbb'],
            plate: ['BBBBBBBBBB'],
            crack: ['s..', '.s.', '.ss', '..s'],
            fingers: ['k.k', 'k.k'],
            leaf: ['g.g', '.g.'],
            shine: ['w', 'w', 'w', 'w', 'w', 'w', 'w'],

            voltjar: { cat: 'Jar Pickle', ht: "1' 8\"", wt: '1 jar', entry: 'Looks exactly like a pickle jar. Whoever opens it gets a shock and a face full of brine.' },
            mrbrine: { cat: 'Mime Pickle', ht: "4' 3\"", wt: '7 jars', entry: 'Mimes so well that its invisible walls turn real. It has never said a word, and never needed to.' },
            gherkarp: { cat: 'Spicy Pickle', ht: "2' 11\"", wt: '2 jars', entry: 'The spiciest pickle there is, and the least useful. Some say it turns into something amazing one day.' },
            dillto: { cat: 'Melt Pickle', ht: "1' 0\"", wt: '1 jar', entry: 'It can turn into any pickle it likes. It always chooses a pickle.' },
            snorelish: { cat: 'Sleep Pickle', ht: "6' 11\"", wt: '460 jars', entry: 'Sleeps 23 hours a day and spends the last hour eating relish. Do not wake it. You cannot wake it.' },
        };
        const pad3 = n => String(n).padStart(3, '0');

        function makePickle(kind, lvl) {
            const max = Math.round((20 + lvl * 2) * (SPECIES[kind].hp || 1));
            return { kind, name: SPECIES[kind].name, lvl, max, hp: max, shownHp: max };
        }

        // Your team of pickles. Up to six; extras go to the Brine Box.
        const team = [makePickle('dillbasaur', 12), makePickle('picklechu', 9), makePickle('brinetle', 10)];
        const brineBox = [];
        let player = team[0];
        const dex = { seen: new Set(team.map(p => p.kind)), caught: new Set(team.map(p => p.kind)) };

        const bag = [
            { id: 'jar', name: 'Pickle Jar', count: 5, rate: 1 },
            { id: 'great', name: 'Great Jar', count: 3, rate: 1.6 },
            { id: 'mason', name: 'Mason Jar', count: 1, rate: 99 },
            { id: 'brine', name: 'Brine', count: 3, heal: 20 },
            { id: 'relish', name: 'Sweet Relish', count: 0, heal: 12 },
            { id: 'gherkin', name: 'Rare Gherkin', count: 1 },
        ];
        // Jars always show; everything else only while you have some
        const bagList = () => bag.filter(it => it.rate || it.count > 0);

        let scene = 'world';                // world | battle
        let mode = 'busy';                  // walk | text | menu | dex | dexEntry | main | fight | bag | team | busy
        let teamMode = 'world';             // world | battle | forced
        let dexAt = 0;                      // the entry open in the Picklédex
        let enemy = null;
        let cursor = 0;
        let queue = [], line = null, shown = 0, onDone = null, looseText = false;
        const fx = { enemyX: 0, enemyFlash: 0, enemyScale: 1, enemyHide: false, playerX: 0, playerFlash: 0, playerScale: 1, jar: null, stars: 0, cover: null };
        let regions = [];

        const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const pick = list => list[rand(0, list.length - 1)];

        function newEnemy() {
            const lvl = rand(5, 14);
            enemy = makePickle(pick(WILD), lvl);
            enemy.max = enemy.hp = enemy.shownHp = Math.round((18 + lvl * 2) * (SPECIES[enemy.kind].hp || 1));
            fx.enemyHide = false; fx.enemyScale = 1; fx.enemyFlash = 0; fx.jar = null;
        }

        /* ---------- TEXT ---------- */
        function say(lines, after, loose = false) {
            queue = Array.isArray(lines) ? [...lines] : [lines];
            onDone = after || (() => toMenu());
            looseText = loose;
            mode = 'text';
            nextLine();
        }

        function nextLine() {
            line = queue.shift();
            shown = 0;
            if (line == null) { const done = onDone; onDone = null; line = null; done && done(); }
        }

        setInterval(() => {
            if (mode === 'text' && line && shown < line.length) { shown += 1; draw(); }
        }, 24);

        function advance() {
            if (mode !== 'text' || !line) return;
            if (shown < line.length) { shown = line.length; draw(); return; }
            sfx.move();
            nextLine();
            draw();
        }

        function toMenu() { mode = 'main'; cursor = 0; draw(); }
        function toWalk() { mode = 'walk'; draw(); }

        /* ---------- TWEENS (timer driven, so they work anywhere) ---------- */
        function tween(ms, step, done) {
            if (reduceMotion) { step(1); draw(); done && done(); return; }
            const start = performance.now();
            const tick = () => {
                const t = Math.min(1, (performance.now() - start) / ms);
                step(t);
                draw();
                if (t < 1) setTimeout(tick, 16); else done && done();
            };
            tick();
        }
        const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
        const play = (ms, step) => new Promise(r => tween(ms, step, r));

        async function drainHp(who, to) {
            const from = who.shownHp;
            who.hp = Math.max(0, Math.min(who.max, to));
            await play(450, t => { who.shownHp = from + (who.hp - from) * t; });
        }

        async function hitFlash(side) {
            sfx.hit();
            for (let i = 0; i < 3; i++) {
                fx[side + 'Flash'] = 1; draw(); await wait(70);
                fx[side + 'Flash'] = 0; draw(); await wait(70);
            }
        }

        async function lunge(side) {
            const dir = side === 'player' ? 1 : -1;
            await play(120, t => { fx[side + 'X'] = dir * 14 * t; });
            await play(160, t => { fx[side + 'X'] = dir * 14 * (1 - t); });
        }

        function sayAsync(lines) { return new Promise(r => say(lines, r)); }

        /* ---------- WALKING ---------- */
        const walkable = (x, y) => '.,=*'.includes(tileAt(x, y) || 'x')
            && !ITEMS.some(it => !it.taken && it.x === x && it.y === y)
            && !(npc.x === x && npc.y === y);

        function press(dir) {
            held = held.filter(d => d !== dir);
            held.push(dir);
            // A tap turns you on the spot; holding walks
            if (!hero.move && hero.dir !== dir) { hero.dir = dir; turnUntil = performance.now() + 110; }
        }

        function step(dir, now) {
            hero.dir = dir;
            const [dx, dy] = DIRS[dir], nx = hero.x + dx, ny = hero.y + dy;
            if (dir === 'up' && tileAt(nx, ny) === 'D') { path = []; held = []; return enterCenter(); }
            if (!walkable(nx, ny)) {
                path = [];
                if (now - lastBump > 280) { sfx.bump(); lastBump = now; }
                return;
            }
            // Your lead pickle steps into the tile you just left
            const fdx = hero.x - follower.x, fdy = hero.y - follower.y;
            if (fdx || fdy) follower.dir = fdx > 0 ? 'right' : fdx < 0 ? 'left' : fdy > 0 ? 'down' : 'up';
            follower.move = { fx: follower.x, fy: follower.y, start: now };
            follower.x = hero.x; follower.y = hero.y;
            hero.move = { fx: hero.x, fy: hero.y, start: now };
            hero.x = nx; hero.y = ny;
            hero.steps++;
        }

        function arrive() {
            if (tileAt(hero.x, hero.y) !== ',') return;
            grassSteps++;
            const chance = grassSteps < 2 ? 0 : Math.min(0.35, 0.1 + (grassSteps - 2) * 0.05);
            if (Math.random() < chance) { grassSteps = 0; held = []; path = []; startBattle(); }
        }

        function updateWalk(now) {
            if (hero.move && now - hero.move.start >= STEP_MS) {
                hero.move = null; follower.move = null;
                arrive();
            }
            if (hero.move || mode !== 'walk') return;
            if (path.length) {
                const next = path.shift();
                if (typeof next === 'string') return step(next, now);
                hero.dir = next.face;
                return interact();
            }
            const dir = held[held.length - 1];
            if (dir && now >= turnUntil) step(dir, now);
        }

        function interact() {
            const [dx, dy] = DIRS[hero.dir], tx = hero.x + dx, ty = hero.y + dy;
            const item = ITEMS.find(it => !it.taken && it.x === tx && it.y === ty);
            if (item) return pickUp(item);
            if (npc.x === tx && npc.y === ty) {
                npc.dir = OPPOSITE[hero.dir];
                sfx.select();
                return say(npc.lines, () => { npc.dir = 'down'; toWalk(); });
            }
            const sign = SIGNS.find(s => s.x === tx && s.y === ty);
            if (sign) { sfx.select(); return say(sign.lines, toWalk); }
            if (tileAt(tx, ty) === 'D') return enterCenter();
            if (tileAt(tx, ty) === '~') { sfx.select(); return say('The brine is too deep to wade in. It smells amazing.', toWalk); }
        }

        function pickUp(item) {
            item.taken = true;
            bag.find(b => b.id === item.id).count++;
            sfx.item();
            say(item.lines, toWalk);
        }

        function enterCenter() {
            hero.dir = 'up';
            sfx.select();
            say(['Welcome to the Pickle Center!', 'We re-brine tired pickles. One moment.'], async () => {
                mode = 'busy';
                await healTeam();
                say(['Your pickles are crunchy again!', 'We hope to see you again.'], toWalk);
            });
        }

        async function healTeam() {
            // The music stops for the healing jingle, then starts over
            setSong(null);
            sfx.heal();
            team.forEach(p => { p.hp = p.shownHp = p.max; });
            await play(900, t => { fx.cover = { kind: 'glow', p: Math.sin(t * Math.PI) }; });
            fx.cover = null;
            await wait(300);
            setSong('map');
        }

        // Click or tap a tile to walk there; click a sign, person, jar or the door to walk up and use it
        function route(goals) {
            const key = (x, y) => x + ',' + y;
            const prev = new Map([[key(hero.x, hero.y), null]]);
            const q = [{ x: hero.x, y: hero.y }];
            while (q.length) {
                const c = q.shift();
                const goal = goals.find(gl => gl.x === c.x && gl.y === c.y);
                if (goal) {
                    const steps = [];
                    for (let k = key(c.x, c.y); prev.get(k); ) { const p = prev.get(k); steps.unshift(p.d); k = key(p.x, p.y); }
                    if (goal.face) steps.push({ face: goal.face });
                    return steps;
                }
                for (const [d, [dx, dy]] of Object.entries(DIRS)) {
                    const nx = c.x + dx, ny = c.y + dy, k = key(nx, ny);
                    if (prev.has(k) || !walkable(nx, ny)) continue;
                    prev.set(k, { x: c.x, y: c.y, d });
                    q.push({ x: nx, y: ny });
                }
            }
            return null;
        }

        function worldClick(p) {
            if (hud && p.x >= hud.x && p.x <= hud.x + hud.w && p.y >= hud.y && p.y <= hud.y + hud.h) return openMenu();
            const cam = camera();
            const tx = Math.floor((p.x + cam.x) / TS), ty = Math.floor((p.y + cam.y) / TS);
            held = [];
            if (walkable(tx, ty)) { path = route([{ x: tx, y: ty }]) || []; return; }
            const usable = ITEMS.some(it => !it.taken && it.x === tx && it.y === ty) || (npc.x === tx && npc.y === ty)
                || SIGNS.some(s => s.x === tx && s.y === ty) || '~D'.includes(tileAt(tx, ty) || 'x');
            if (!usable) return;
            const goals = Object.entries(DIRS)
                .filter(([d]) => tileAt(tx, ty) !== 'D' || d === 'up')
                .map(([d, [dx, dy]]) => ({ x: tx - dx, y: ty - dy, face: d }))
                .filter(gl => walkable(gl.x, gl.y) || (gl.x === hero.x && gl.y === hero.y));
            path = route(goals) || [];
        }

        /* ---------- INTO AND OUT OF BATTLE ---------- */
        async function startBattle() {
            mode = 'busy';
            setSong('battle');
            sfx.encounter();
            await play(600, t => { fx.cover = { kind: 'flash', p: t }; });
            await play(480, t => { fx.cover = { kind: 'bars', p: t }; });
            scene = 'battle';
            enemy = null;
            player = team.find(p => p.hp > 0) || team[0];
            fx.playerScale = 1;
            await play(300, t => { fx.cover = { kind: 'bars', p: 1 - t }; });
            fx.cover = null;
            encounter();
        }

        async function encounter() {
            newEnemy();
            dex.seen.add(enemy.kind);
            fx.enemyX = 200;
            mode = 'busy';
            await play(500, t => { fx.enemyX = 200 * (1 - t); });
            say(`A wild ${enemy.name} appeared!`, () => say(`Go, ${player.name}!`));
        }

        async function endBattle(toCenter = false) {
            mode = 'busy';
            await play(320, t => { fx.cover = { kind: 'fade', p: t }; });
            scene = 'world';
            setSong('map');
            enemy = null;
            Object.assign(fx, { enemyX: 0, enemyFlash: 0, enemyScale: 1, enemyHide: false, playerX: 0, playerFlash: 0, playerScale: 1, jar: null, stars: 0 });
            held = []; path = [];
            if (toCenter) {
                team.forEach(p => { p.hp = p.shownHp = p.max; });
                Object.assign(hero, { x: 4, y: 5, dir: 'down', move: null });
                Object.assign(follower, { x: 4, y: 5, move: null });
            }
            await play(320, t => { fx.cover = { kind: 'fade', p: 1 - t }; });
            fx.cover = null;
            if (toCenter) return say(['The Pickle Center re-brined your whole team.', 'Everyone is crunchy again.'], toWalk);
            toWalk();
        }

        /* ---------- TURNS ---------- */
        async function useMove(name) {
            const m = MOVE[name];
            mode = 'busy';
            await sayAsync(`${player.name} used ${name}!`);
            mode = 'busy';
            await lunge('player');
            if (m.max > 0) {
                await hitFlash('enemy');
                await drainHp(enemy, enemy.hp - rand(m.min, m.max));
            }
            await sayAsync(m.line);
            if (enemy.hp <= 0) {
                fx.enemyHide = true; draw();
                player.lvl++; player.max += 2; player.hp += 2; player.shownHp = player.hp;
                await sayAsync([`The wild ${enemy.name} fainted!`, 'It has been pickled to perfection.', `${player.name} grew to level ${player.lvl}!`]);
                return endBattle();
            }
            await enemyTurn();
        }

        async function enemyTurn() {
            mode = 'busy';
            const name = pick(movesOf(enemy)), m = MOVE[name];
            await sayAsync(`The wild ${enemy.name} used ${name}!`);
            mode = 'busy';
            await lunge('enemy');
            if (m.max > 0) {
                await hitFlash('player');
                await drainHp(player, player.hp - Math.max(1, Math.round(rand(m.min, m.max) * 0.6)));
            } else {
                await sayAsync(m.line);
            }
            if (player.hp <= 0) {
                await play(300, t => { fx.playerScale = 1 - t; });
                await sayAsync(`${player.name} fainted!`);
                if (team.some(p => p.hp > 0)) return openTeam('forced');
                await sayAsync(['You have no crunchy pickles left!', 'You rushed to the Pickle Center.']);
                return endBattle(true);
            }
            toMenu();
        }

        async function switchTo(p, forced) {
            mode = 'busy';
            if (!forced) {
                await sayAsync(`Come back, ${player.name}!`);
                mode = 'busy';
                sfx.swap();
                await play(260, t => { fx.playerScale = 1 - t; });
            }
            player = p;
            fx.playerScale = 0;
            sfx.swap();
            await play(260, t => { fx.playerScale = t; });
            await sayAsync(`Go, ${p.name}!`);
            if (forced) return toMenu();
            await enemyTurn();
        }

        async function throwJar(item) {
            mode = 'busy';
            item.count--;
            await sayAsync(`You threw a ${item.name}!`);
            mode = 'busy';
            // Arc from your side to the wild pickle
            sfx.throwJar();
            await play(520, t => {
                fx.jar = { kind: item.id, x: 120 + 230 * t, y: 190 - 120 * t - Math.sin(t * Math.PI) * 120, rot: t * 12 };
            });
            // The pickle is sucked into the jar
            await play(260, t => { fx.enemyFlash = 1; fx.enemyScale = 1 - t; });
            fx.enemyHide = true; fx.enemyFlash = 0;
            await play(220, t => { fx.jar.y = 70 + 36 * t; fx.jar.rot = 0; });
            const hpPart = enemy.hp / enemy.max;
            const chance = Math.min(1, (1 - hpPart * 0.7) * 0.55 * item.rate * (SPECIES[enemy.kind].catch || 1));
            let wobbles = 0;
            for (let i = 0; i < 3; i++) {
                if (Math.random() > chance + 0.15) break;
                wobbles++;
                await wait(250);
                sfx.wobble();
                await play(360, t => { fx.jar.rot = Math.sin(t * Math.PI * 2) * 0.35; });
            }
            await wait(300);
            if (wobbles === 3 || item.rate > 50) {
                sfx.catch();
                await play(500, t => { fx.stars = t; });
                const caught = makePickle(enemy.kind, enemy.lvl);
                dex.caught.add(enemy.kind);
                caught.hp = caught.shownHp = Math.max(1, enemy.hp);
                const lines = [`Gotcha! ${enemy.name} was jarred!`];
                if (team.length < 6) { team.push(caught); lines.push(`${enemy.name} joined your team of pickles.`); }
                else { brineBox.push(caught); lines.push(`Your team is full, so ${enemy.name} went to the Brine Box.`); }
                await sayAsync(lines);
                fx.stars = 0; fx.jar = null;
                return endBattle();
            }
            sfx.nope();
            fx.jar = null; fx.enemyHide = false;
            await play(260, t => { fx.enemyScale = t; });
            await sayAsync([wobbles ? 'Argh! It was so close to being pickled!' : 'Oh no! The pickle broke free!']);
            await enemyTurn();
        }

        async function useItem(item) {
            if (item.count <= 0) { sfx.nope(); return say(`You're out of ${item.name}s.`, () => openBag()); }
            if (item.rate) return throwJar(item);
            mode = 'busy';
            item.count--;
            if (item.heal) {
                await sayAsync(item.id === 'brine' ? `You poured Brine on ${player.name}.` : `You fed Sweet Relish to ${player.name}.`);
                mode = 'busy';
                await drainHp(player, player.hp + item.heal);
                await sayAsync(item.id === 'brine' ? `${player.name} feels briny and refreshed.` : 'Technically, that was a pickle too.');
            } else {
                player.lvl++;
                player.max += 3;
                await sayAsync([`${player.name} ate the Rare Gherkin.`, `${player.name} grew to level ${player.lvl}!`, 'It is still a pickle.']);
            }
            await enemyTurn();
        }

        function openBag() { mode = 'bag'; cursor = 0; draw(); }

        const START = ['Picklédex', 'Pickles', 'Close'];

        function openMenu(at = 0) {
            mode = 'menu';
            cursor = at;
            held = []; path = [];
            sfx.select();
            draw();
        }

        function openDex(at = dexAt) {
            mode = 'dex';
            cursor = at;
            sfx.select();
            draw();
        }

        function openEntry(i) {
            if (!dex.seen.has(DEX[i])) { sfx.nope(); return; }
            dexAt = i;
            mode = 'dexEntry';
            sfx.select();
            draw();
        }

        // Flip to the next pickle you have seen
        function flipEntry(step) {
            for (let i = dexAt + step; i >= 0 && i < DEX.length; i += step) {
                if (dex.seen.has(DEX[i])) { dexAt = i; sfx.move(); return draw(); }
            }
        }

        function openTeam(kind) {
            teamMode = kind;
            mode = 'team';
            cursor = kind === 'battle' ? Math.max(0, team.indexOf(player)) : 0;
            held = []; path = [];
            sfx.select();
            draw();
        }

        function teamChoose(i) {
            if (i === team.length) return back();
            const p = team[i];
            if (teamMode === 'world') {
                if (i === 0) return say(`${p.name} is already leading.`, () => openTeam('world'));
                team.splice(i, 1);
                team.unshift(p);
                return say(`${p.name} is leading now.`, toWalk);
            }
            if (p === player && p.hp > 0) return say(`${p.name} is already out there!`, () => openTeam(teamMode));
            if (p.hp <= 0) return say(`${p.name} is too soggy to battle.`, () => openTeam(teamMode));
            switchTo(p, teamMode === 'forced');
        }

        /* ---------- MENUS ---------- */
        const MAIN = ['Fight', 'Bag', 'Pickles', 'Flee'];

        function choose(i) {
            sfx.select();
            if (mode === 'main') {
                if (i === 0) { mode = 'fight'; cursor = 0; return draw(); }
                if (i === 1) return openBag();
                if (i === 2) return openTeam('battle');
                if (i === 3) {
                    return Math.random() < 0.5
                        ? say("You can't escape a pickle. It rolls.", () => enemyTurn())
                        : say('Got away safely! The pickle is still out there.', () => endBattle());
                }
            }
            if (mode === 'fight') { const moves = movesOf(player); return i === moves.length ? toMenu() : useMove(moves[i]); }
            if (mode === 'bag') { const list = bagList(); return i === list.length ? toMenu() : useItem(list[i]); }
            if (mode === 'team') return teamChoose(i);
            if (mode === 'menu') return i === 0 ? openDex() : i === 1 ? openTeam('world') : toWalk();
            if (mode === 'dex') { if (i === DEX.length) return back(); dexAt = i; return openEntry(i); }
            if (mode === 'dexEntry') return back();
        }

        function back() {
            if (mode === 'fight' || mode === 'bag') { sfx.move(); return toMenu(); }
            if (mode === 'team' && teamMode !== 'forced') { sfx.move(); return teamMode === 'world' ? toWalk() : toMenu(); }
            if (mode === 'menu') { sfx.move(); return toWalk(); }
            if (mode === 'dex') { sfx.move(); dexAt = Math.min(cursor, DEX.length - 1); return openMenu(0); }
            if (mode === 'dexEntry') { sfx.move(); return openDex(dexAt); }
        }

        function optionCount() {
            if (mode === 'main') return 4;
            if (mode === 'fight') return movesOf(player).length + 1;
            if (mode === 'bag') return bagList().length + 1;
            if (mode === 'team') return team.length + (teamMode === 'forced' ? 0 : 1);
            if (mode === 'menu') return START.length;
            if (mode === 'dex') return DEX.length + 1;
            return 0;
        }

        const KEY_DIR = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
        const OK = ['Enter', ' ', 'z', 'Z'], CANCEL = ['x', 'X', 'Backspace'];

        addEventListener('keydown', e => {
            const k = e.key, dir = KEY_DIR[k];
            if (k === 'm' || k === 'M') return toggleMusic();
            if (mode === 'text') {
                if (OK.includes(k) || CANCEL.includes(k)) { e.preventDefault(); advance(); }
                else if (dir && looseText) {
                    // The welcome message gets out of the way as soon as you start walking
                    e.preventDefault();
                    queue = []; nextLine();
                    press(dir);
                }
                return;
            }
            if (mode === 'walk') {
                if (dir) { e.preventDefault(); path = []; if (!e.repeat) press(dir); return; }
                if (OK.includes(k)) { e.preventDefault(); return interact(); }
                if (['x', 'X'].includes(k)) { e.preventDefault(); return openMenu(); }
                if (['p', 'P'].includes(k)) { e.preventDefault(); return openTeam('world'); }
                return;
            }
            if (mode === 'dexEntry') {
                e.preventDefault();
                if (dir === 'left' || dir === 'up') return flipEntry(-1);
                if (dir === 'right' || dir === 'down') return flipEntry(1);
                if (OK.includes(k) || CANCEL.includes(k)) return back();
                return;
            }
            const n = optionCount();
            if (!n) return;
            const cols = mode === 'main' || mode === 'fight' ? 2 : 1;
            let next = cursor;
            if (dir === 'right') next = cols === 2 && cursor % 2 === 0 ? cursor + 1 : cursor;
            else if (dir === 'left') next = cols === 2 && cursor % 2 === 1 ? cursor - 1 : cursor;
            else if (dir === 'down') next = cursor + cols;
            else if (dir === 'up') next = cursor - cols;
            else if (OK.includes(k)) { e.preventDefault(); return choose(cursor); }
            else if (CANCEL.includes(k)) { e.preventDefault(); return back(); }
            else return;
            e.preventDefault();
            if (next >= 0 && next < n && next !== cursor) { cursor = next; sfx.move(); draw(); }
        });

        addEventListener('keyup', e => {
            const dir = KEY_DIR[e.key];
            if (dir) held = held.filter(d => d !== dir);
        });
        addEventListener('blur', () => { held = []; });

        function pointFromEvent(e) {
            const r = canvas.getBoundingClientRect();
            return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
        }

        canvas.addEventListener('click', e => {
            canvas.focus();
            if (mode === 'text') return advance();
            const p = pointFromEvent(e);
            if (mode === 'walk') return worldClick(p);
            if (mode === 'dexEntry') return back();
            const hit = regions.find(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
            if (hit) { cursor = hit.i; choose(hit.i); }
        });

        // Scroll the Picklédex list with the wheel
        canvas.addEventListener('wheel', e => {
            if (mode !== 'dex') return;
            e.preventDefault();
            const next = Math.max(0, Math.min(DEX.length - 1, cursor + Math.sign(e.deltaY)));
            if (next !== cursor) { cursor = next; sfx.move(); draw(); }
        }, { passive: false });

        canvas.addEventListener('mousemove', e => {
            if (mode === 'text' || mode === 'busy' || mode === 'walk') return;
            const p = pointFromEvent(e);
            const hit = regions.find(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
            if (hit && hit.i !== cursor) { cursor = hit.i; sfx.move(); draw(); }
        });

        /* ---------- DRAWING ---------- */
        function box(x, y, w, h, fill = '#f8fbef') {
            g.fillStyle = '#26402a';
            g.beginPath(); g.roundRect(x, y, w, h, 10); g.fill();
            g.fillStyle = '#b7d48a';
            g.beginPath(); g.roundRect(x + 3, y + 3, w - 6, h - 6, 8); g.fill();
            g.fillStyle = fill;
            g.beginPath(); g.roundRect(x + 6, y + 6, w - 12, h - 12, 6); g.fill();
        }

        function text(str, x, y, size = 18, color = '#22301f', weight = 400) {
            g.font = `${weight} ${size}px ${FONT}`;
            g.fillStyle = color;
            g.textBaseline = 'alphabetic';
            g.fillText(str, x, y);
        }

        function hpBar(who, bx, by, bw) {
            g.fillStyle = '#3c4a38'; g.fillRect(bx - 2, by - 2, bw + 4, 12);
            g.fillStyle = '#e8eedc'; g.fillRect(bx, by, bw, 8);
            const pct = Math.max(0, who.shownHp / who.max);
            g.fillStyle = pct > 0.5 ? '#4fc860' : pct > 0.2 ? '#f0c030' : '#e04848';
            g.fillRect(bx, by, Math.round(bw * pct), 8);
        }

        function hpBox(who, x, y, w, showNumbers) {
            box(x, y, w, showNumbers ? 70 : 56);
            text(who.name, x + 16, y + 26, 18, '#22301f', 600);
            text(`Lv${who.lvl}`, x + w - 58, y + 26, 16);
            text('HP', x + 16, y + 45, 13, '#e0a020', 600);
            hpBar(who, x + 50, y + 36, w - 70);
            if (showNumbers) text(`${Math.ceil(Math.max(0, who.shownHp))} / ${who.max}`, x + w - 92, y + 62, 15);
        }

        function drawSprite(img, x, y, scale, flash, hide, s = 1) {
            if (hide || s <= 0) return;
            const w = img.width * scale * s, h = img.height * scale * s;
            g.save();
            g.imageSmoothingEnabled = false;
            if (flash) g.filter = 'brightness(3) saturate(0)';
            g.drawImage(img, x + (img.width * scale - w) / 2, y + (img.height * scale - h), w, h);
            g.restore();
        }

        const blit = (img, x, y) => g.drawImage(img, Math.round(x), Math.round(y), img.width * 2, img.height * 2);

        function draw() {
            regions = [];
            g.imageSmoothingEnabled = false;
            if (mode === 'team') drawTeam();
            else if (mode === 'dex') drawDex();
            else if (mode === 'dexEntry') drawDexEntry();
            else if (scene === 'world') drawWorld();
            else drawBattle();
            drawCover();
        }

        function drawDialog() {
            box(6, 232, W - 12, 82);
            wrap(line.slice(0, shown), 26, 266, 420);
            if (shown >= line.length && Math.floor(performance.now() / 400) % 2) {
                g.fillStyle = '#e04848';
                g.beginPath(); g.moveTo(446, 290); g.lineTo(458, 290); g.lineTo(452, 298); g.fill();
            }
        }

        function actorPos(a, now) {
            if (!a.move) return { x: a.x * TS, y: a.y * TS, t: 1 };
            const t = Math.min(1, (now - a.move.start) / STEP_MS);
            return { x: (a.move.fx + (a.x - a.move.fx) * t) * TS, y: (a.move.fy + (a.y - a.move.fy) * t) * TS, t };
        }

        function camera(now = performance.now()) {
            const p = actorPos(hero, now);
            const cx = Math.max(0, Math.min(MAP_W * TS - W, p.x + TS / 2 - W / 2));
            const cy = Math.max(0, Math.min(MAP_H * TS - H, p.y + TS / 2 - H / 2));
            return { x: Math.round(cx / 2) * 2, y: Math.round(cy / 2) * 2 };
        }

        function drawWorld() {
            const now = performance.now();
            const cam = camera(now);
            const beat = ms => reduceMotion ? 0 : Math.floor(now / ms);
            const sway = beat(500) % 2;
            const tx0 = Math.floor(cam.x / TS), ty0 = Math.floor(cam.y / TS);

            for (let ty = ty0; ty <= ty0 + H / TS; ty++) {
                for (let tx = tx0; tx <= tx0 + W / TS; tx++) {
                    const ch = tileAt(tx, ty);
                    if (!ch) continue;
                    const sx = tx * TS - cam.x, sy = ty * TS - cam.y, h = hash(tx, ty);
                    if (ch === ',') blit(TALL[sway], sx, sy);
                    else if (ch === '=') blit(PATH[h % 2], sx, sy);
                    else if (ch === '*') blit(FLOWERS[(beat(700) + h) % 2], sx, sy);
                    else if (ch === '~') {
                        blit(WATER[(beat(600) + h) % 2], sx, sy);
                        if (h % 9 === 0) blit(SLICE, sx + 10, sy + 10 + (beat(900) % 2) * 2);
                        if (tileAt(tx, ty - 1) !== '~') {
                            g.fillStyle = '#e6f2d8'; g.fillRect(sx, sy, TS, 4);
                            g.fillStyle = '#6aa88a'; g.fillRect(sx, sy + 4, TS, 2);
                        }
                    } else {
                        blit(GRASS[h % 3], sx, sy);
                        if (ch === 'T') blit(TREE, sx, sy);
                        else if (ch === 'F') blit(FENCE, sx, sy);
                        else if (ch === 'S') blit(SIGN, sx, sy);
                    }
                }
            }
            blit(CENTER, 2 * TS - cam.x, 2 * TS - cam.y);

            // Everyone, back to front
            const actors = [];
            ITEMS.forEach(it => {
                if (it.taken) return;
                actors.push({ y: it.y * TS, draw: () => {
                    const sx = it.x * TS - cam.x, sy = it.y * TS - cam.y;
                    blit(ITEM_JAR[it.id] || ITEM_JAR.jar, sx + 4, sy + 4);
                    if ((beat(260) + hash(it.x, it.y)) % 7 === 0) {
                        g.fillStyle = '#ffffff';
                        g.fillRect(sx + 22, sy + 2, 2, 6); g.fillRect(sx + 20, sy + 4, 6, 2);
                    }
                } });
            });
            actors.push({ y: npc.y * TS, draw: () => blit(FAN[npc.dir][0], npc.x * TS - cam.x, npc.y * TS - cam.y - 8) });
            const fp = actorPos(follower, now);
            const lead = team[0];
            const showFollower = !(follower.x === hero.x && follower.y === hero.y);
            if (showFollower) {
                actors.push({ y: fp.y, draw: () => {
                    const img = follower.dir === 'up' ? ICON_BACK[lead.kind] : follower.dir === 'right' ? ICON_RIGHT[lead.kind] : ICON[lead.kind];
                    const bob = follower.move && fp.t > 0.2 && fp.t < 0.7 ? -2 : 0;
                    blit(img, fp.x - cam.x, fp.y - cam.y - 4 + bob);
                } });
            }
            const hp = actorPos(hero, now);
            actors.push({ y: hp.y, draw: () => {
                const frame = hero.move && hp.t > 0.1 && hp.t < 0.8 ? 1 + (hero.steps % 2) : 0;
                blit(YOU[hero.dir][frame], hp.x - cam.x, hp.y - cam.y - 8);
            } });
            actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());

            // Tall dill hides your feet
            const feetIn = a => {
                const p = actorPos(a, now);
                const x = a.move && p.t < 0.5 ? a.move.fx : a.x, y = a.move && p.t < 0.5 ? a.move.fy : a.y;
                if (tileAt(x, y) === ',') blit(TALL_FRONT[sway], x * TS - cam.x, y * TS - cam.y);
            };
            feetIn(hero);
            if (showFollower) feetIn(follower);

            hud = null;
            if (mode === 'walk') drawHud();
            if (mode === 'menu') drawStartMenu();
            if (mode === 'text' && line) drawDialog();
        }

        function drawHud() {
            const w = 92, h = 30, x = W - w - 8, y = 8;
            g.fillStyle = '#26402a'; g.beginPath(); g.roundRect(x, y, w, h, 15); g.fill();
            g.fillStyle = '#f8fbef'; g.beginPath(); g.roundRect(x + 2, y + 2, w - 4, h - 4, 13); g.fill();
            g.drawImage(ICON[team[0].kind], x + 9, y + 7, 16, 16);
            text('Menu', x + 34, y + 20, 16, '#22301f', 600);
            hud = { x, y, w, h };
        }

        function drawStartMenu() {
            box(W - 168, 8, 160, 116, '#ffffff');
            START.forEach((label, i) => option(label, W - 136, 44 + i * 30, i, 120, 30));
        }

        // A little jar: the mark for a pickle you have caught
        function jarMark(x, y) {
            g.fillStyle = '#26402a'; g.fillRect(x, y, 10, 12);
            g.fillStyle = LIDS.jar; g.fillRect(x + 1, y + 1, 8, 3);
            g.fillStyle = '#6aa83a'; g.fillRect(x + 1, y + 5, 8, 6);
        }

        function drawDex() {
            g.fillStyle = '#eef5df'; g.fillRect(0, 0, W, H);
            const at = Math.min(cursor, DEX.length - 1), kind = DEX[at], seen = dex.seen.has(kind);

            // The picture
            box(8, 8, 196, 220, '#ffffff');
            g.fillStyle = '#dcebc4';
            g.beginPath(); g.ellipse(106, 130, 62, 10, 0, 0, Math.PI * 2); g.fill();
            if (seen) {
                const img = FRONT[kind];
                g.drawImage(img, 106 - img.width, 134 - img.height * 2, img.width * 2, img.height * 2);
            } else {
                text('?', 94, 112, 44, '#b7c99a', 600);
            }
            text(`No.${pad3(at + 1)}`, 24, 168, 15, '#5f6b4c');
            text(seen ? SPECIES[kind].name : '-----', 24, 194, 20, '#22301f', 600);
            if (dex.caught.has(kind)) jarMark(176, 180);

            // The list
            box(210, 8, 262, 220, '#ffffff');
            const rows = 7, top = Math.max(0, Math.min(DEX.length - rows, at - 3));
            for (let r = 0; r < rows; r++) {
                const i = top + r, k = DEX[i], y = 42 + r * 28;
                regions.push({ x: 214, y: y - 20, w: 254, h: 28, i });
                text(pad3(i + 1), 238, y, 15, '#5f6b4c');
                text(dex.seen.has(k) ? SPECIES[k].name : '-----', 278, y, 18, '#22301f', cursor === i ? 600 : 400);
                if (dex.caught.has(k)) jarMark(446, y - 12);
                if (cursor === i) {
                    g.fillStyle = '#22301f';
                    g.beginPath(); g.moveTo(222, y - 13); g.lineTo(230, y - 7); g.lineTo(222, y - 1); g.fill();
                }
            }
            g.fillStyle = '#b7c99a';
            if (top > 0) { g.beginPath(); g.moveTo(452, 22); g.lineTo(458, 16); g.lineTo(464, 22); g.fill(); }
            if (top + rows < DEX.length) { g.beginPath(); g.moveTo(452, 212); g.lineTo(458, 218); g.lineTo(464, 212); g.fill(); }

            box(6, 232, W - 12, 82);
            wrap(`Seen ${dex.seen.size}   Caught ${dex.caught.size}   of ${DEX.length}`, 26, 266, 340);
            option('Back', 410, 266, DEX.length, 56);
        }

        function drawDexEntry() {
            const kind = DEX[dexAt], info = DEX_INFO[kind], caught = dex.caught.has(kind);
            g.fillStyle = '#eef5df'; g.fillRect(0, 0, W, H);
            box(8, 8, W - 16, 220, '#ffffff');
            g.fillStyle = '#dcebc4';
            g.beginPath(); g.ellipse(88, 156, 64, 11, 0, 0, Math.PI * 2); g.fill();
            const img = FRONT[kind];
            g.drawImage(img, 88 - img.width, 160 - img.height * 2, img.width * 2, img.height * 2);
            text(`No.${pad3(dexAt + 1)}`, 176, 48, 15, '#5f6b4c');
            text(SPECIES[kind].name, 176, 80, 26, '#22301f', 600);
            const nameW = Math.ceil(g.measureText(SPECIES[kind].name).width);
            text(caught ? info.cat : '???', 176, 108, 16, '#5f6b4c');
            text(`Ht   ${caught ? info.ht : '???'}`, 176, 152, 16);
            text(`Wt   ${caught ? info.wt : '???'}`, 176, 180, 16);
            if (caught) jarMark(176 + nameW + 12, 62);
            box(6, 232, W - 12, 82);
            wrap(caught ? info.entry : 'Catch one to fill in this page.', 24, 262, 432, 16, 21);
        }

        function drawTeam() {
            const now = performance.now();
            g.fillStyle = '#eef5df'; g.fillRect(0, 0, W, H);
            team.forEach((p, i) => {
                const y = 8 + i * 37, sel = cursor === i, out = p.hp <= 0;
                g.fillStyle = '#26402a'; g.beginPath(); g.roundRect(10, y, W - 20, 34, 8); g.fill();
                g.fillStyle = out ? '#e4ddcc' : sel ? '#ffffff' : '#f8fbef';
                g.beginPath(); g.roundRect(12, y + 2, W - 24, 30, 6); g.fill();
                const bob = !reduceMotion && Math.floor(now / (sel ? 160 : 420) + i) % 2 ? -2 : 0;
                blit(ICON[p.kind], 22, y + 1 + bob);
                text(p.name, 64, y + 23, 17, out ? '#7a7a68' : '#22301f', 600);
                text(`Lv${p.lvl}`, 200, y + 23, 15);
                text('HP', 262, y + 22, 13, '#e0a020', 600);
                hpBar(p, 290, y + 13, 104);
                text(`${Math.ceil(Math.max(0, p.shownHp))}/${p.max}`, 406, y + 23, 14);
                if (sel) {
                    g.fillStyle = '#22301f';
                    g.beginPath(); g.moveTo(14, y + 10); g.lineTo(20, y + 17); g.lineTo(14, y + 24); g.fill();
                }
                regions.push({ x: 10, y, w: W - 20, h: 34, i });
            });
            box(6, 232, W - 12, 82);
            const prompt = teamMode === 'forced' ? 'Choose your next pickle.' : teamMode === 'battle' ? 'Choose a pickle.' : 'Pick a pickle to lead the way.';
            wrap(prompt, 26, 266, 340);
            if (teamMode !== 'forced') option('Back', 410, 266, team.length, 56);
        }

        function drawCover() {
            const c = fx.cover;
            if (!c) return;
            if (c.kind === 'flash') {
                const i = Math.floor(c.p * 8);
                g.fillStyle = i % 2 ? 'rgba(20, 30, 18, 0.55)' : 'rgba(248, 251, 239, 0.9)';
                g.fillRect(0, 0, W, H);
            } else if (c.kind === 'bars') {
                g.fillStyle = '#0c100b';
                const n = 10, bh = H / n, w = W * c.p;
                for (let i = 0; i < n; i++) g.fillRect(i % 2 ? W - w : 0, i * bh, w, bh + 1);
            } else if (c.kind === 'fade') {
                g.fillStyle = `rgba(248, 251, 239, ${c.p})`;
                g.fillRect(0, 0, W, H);
            } else if (c.kind === 'glow') {
                g.fillStyle = `rgba(156, 207, 94, ${c.p * 0.45})`;
                g.fillRect(0, 0, W, H);
            }
        }

        function drawBattle() {
            // Field
            g.fillStyle = '#eef5df'; g.fillRect(0, 0, W, H);
            g.fillStyle = '#dcebc4'; g.fillRect(0, 120, W, 110);
            for (let y = 124; y < 228; y += 6) { g.fillStyle = 'rgba(120,160,80,0.08)'; g.fillRect(0, y, W, 2); }

            // Platforms
            g.fillStyle = '#a9c97a';
            g.beginPath(); g.ellipse(352, 116, 86, 18, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#c1dc95';
            g.beginPath(); g.ellipse(352, 112, 80, 14, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#a9c97a';
            g.beginPath(); g.ellipse(128, 222, 108, 20, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#c1dc95';
            g.beginPath(); g.ellipse(128, 218, 102, 16, 0, 0, Math.PI * 2); g.fill();

            // Wild pickle
            if (enemy) {
                const front = FRONT[enemy.kind];
                drawSprite(front, 352 - front.width + fx.enemyX, 118 - front.height * 2, 2, fx.enemyFlash, fx.enemyHide, fx.enemyScale);
            }
            // Your pickle, from behind
            const back = BACK[player.kind];
            drawSprite(back, 116 - back.width + fx.playerX, 216 - back.height * 2, 2, fx.playerFlash, false, fx.playerScale);

            // A jar in flight, or sitting on the platform
            if (fx.jar) {
                g.save();
                g.translate(fx.jar.x, fx.jar.y);
                g.rotate(fx.jar.rot);
                g.imageSmoothingEnabled = false;
                g.drawImage(JARS[fx.jar.kind], -20, -20, 40, 40);
                g.restore();
                if (fx.stars) {
                    g.fillStyle = '#ffd84a';
                    for (let i = 0; i < 5; i++) {
                        const a = -Math.PI / 2 + (i - 2) * 0.5, d = 18 + fx.stars * 26;
                        g.fillRect(fx.jar.x + Math.cos(a) * d - 3, fx.jar.y - 10 + Math.sin(a) * d - 3, 6, 6);
                    }
                }
            }

            if (enemy) hpBox(enemy, 24, 20, 220, false);
            hpBox(player, 252, 140, 210, true);

            // One little jar per pickle on your team; empty when it has fainted
            team.forEach((p, i) => {
                const jx = 268 + i * 16, jy = 214;
                g.fillStyle = '#26402a'; g.fillRect(jx, jy, 10, 12);
                g.fillStyle = LIDS.jar; g.fillRect(jx + 1, jy + 1, 8, 3);
                g.fillStyle = p.hp > 0 ? '#6aa83a' : '#d8d2c0'; g.fillRect(jx + 1, jy + 5, 8, 6);
            });

            // Dialog
            if (mode === 'text' && line) return drawDialog();
            box(6, 232, W - 12, 82);
            if (mode === 'main') {
                wrap(`What will ${player.name} do?`, 26, 266, 210);
                box(250, 232, 224, 82, '#ffffff');
                MAIN.forEach((label, i) => option(label, 286 + (i % 2) * 96, 266 + Math.floor(i / 2) * 30, i, 90));
            } else if (mode === 'fight') {
                movesOf(player).forEach((name, i) => option(name, 40 + (i % 2) * 190, 266 + Math.floor(i / 2) * 30, i, 180));
                option('Back', 410, 266, movesOf(player).length, 56);
            } else if (mode === 'bag') {
                const list = bagList();
                wrap('Every item in the bag is a pickle.', 26, 266, 210);
                box(250, 40, 224, 190, '#ffffff');
                list.forEach((it, i) => option(`${it.name}  x${it.count}`, 280, 70 + i * 24, i, 186, 24));
                option('Close', 280, 70 + list.length * 24, list.length, 186, 24);
            }
        }

        function option(label, x, y, i, w, rowH = 28) {
            regions.push({ x: x - 22, y: y - rowH + 8, w: w + 22, h: rowH, i });
            text(label, x, y, 18, '#22301f', cursor === i ? 600 : 400);
            if (cursor === i) {
                g.fillStyle = '#22301f';
                g.beginPath(); g.moveTo(x - 16, y - 13); g.lineTo(x - 8, y - 7); g.lineTo(x - 16, y - 1); g.fill();
            }
        }

        function wrap(str, x, y, maxW, size = 18, lineH = 26) {
            g.font = `400 ${size}px ${FONT}`;
            const words = str.split(' ');
            let row = '', yy = y;
            words.forEach(word => {
                const test = row ? row + ' ' + word : word;
                if (g.measureText(test).width > maxW && row) { text(row, x, yy, size); row = word; yy += lineH; }
                else row = test;
            });
            if (row) text(row, x, yy, size);
        }

        // The world keeps moving: walking, swaying dill, rippling brine
        setInterval(() => {
            if (scene === 'world') updateWalk(performance.now());
            if (scene === 'world' || mode === 'team') draw();
        }, 16);

        // Keep the ▼ blinking while a line waits
        setInterval(() => { if (mode === 'text' && line && shown >= line.length) draw(); }, 400);

        // ?sheet lays every pickle out, front and back, for checking the art
        const SHEET = new URLSearchParams(location.search).has('sheet');
        if (SHEET) {
            const stageEl = document.getElementById('stage'), grid = document.createElement('div');
            grid.className = 'sheet';
            for (const kind of Object.keys(DESIGNS)) {
                const card = document.createElement('figure');
                [FRONT[kind], BACK[kind]].forEach(img => {
                    const c = document.createElement('canvas');
                    c.width = c.height = 56;
                    c.getContext('2d').drawImage(img, 0, 0);
                    card.appendChild(c);
                });
                const cap = document.createElement('figcaption');
                cap.textContent = SPECIES[kind].name;
                card.appendChild(cap);
                grid.appendChild(card);
            }
            stageEl.replaceChildren(grid);
        }

        (document.fonts ? document.fonts.load(`18px ${FONT}`) : Promise.resolve()).then(() => {
            if (SHEET) return;
            say(['Welcome to the world of Picklémon!', 'Wild pickles live in the tall dill.'], toWalk, true);
        });
    </script>
</body>
</html>
